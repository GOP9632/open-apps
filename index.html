<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>open-apps</title>
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="open-apps">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="description" content="把常用的付費軟體做成免費開源的版本">
<!-- 先跟 app 會用到的伺服器打好招呼，點進 app 時少等幾輪連線 -->
<link rel="preconnect" href="https://gop9632.github.io" crossorigin>
<link rel="preconnect" href="https://ptocokzxpwwautnbbuup.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2129;--muted:#5f6670;--line:#e3e6ea;--accent:#2f6fec;--tag:#eef3ff;--tag2:#f1f2f4}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e24;--text:#e6e8eb;--muted:#9aa1ab;--line:#2a3038;--accent:#5b9dff;--tag:#1e2a40;--tag2:#252a31}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:var(--text);background:var(--bg)}
main{max-width:1080px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1{font-size:28px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 28px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column}
.card .actions{margin-top:auto;padding-top:14px}
.top{display:flex;gap:14px;align-items:flex-start}
.icon{font-size:30px;line-height:1}
.card h2{font-size:19px;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--tag2);color:var(--muted)}
.tag.web{background:var(--tag);color:var(--accent)}
.card p{margin:0;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-block;padding:8px 16px;border-radius:10px;text-decoration:none;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{border:1px solid var(--line);color:var(--text)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--accent);font-weight:600}
ol{margin:8px 0 0;padding-left:22px;color:var(--text)}
ol li{margin:4px 0}
footer{margin-top:36px;font-size:14px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>open-apps</h1>
  <p class="lead">把常用的付費軟體，做成自己和朋友能免費用的開源版本。網頁版點開就能用，Mac App 要在自己電腦上裝。</p>
  <div id="list">載入中…</div>
  <footer>原始碼在 <a href="https://github.com/GOP9632/open-apps">GitHub</a>。</footer>
</main>
<script>
// App 清單放在 apps.json，新增 App 只要改那個檔案。
// Netlify 上的這頁直接讀 GitHub Pages 上最新的 apps.json，所以 PR 合併後新 App 就會出現，不用重新部署 Netlify。
const LIST = 'https://gop9632.github.io/open-apps/apps.json';
// 在 Netlify 上把 app 連結換成同網域的 /apps/...（_redirects 會代理到 GitHub Pages），
// 從主畫面的入口點進 app 才會維持全螢幕，不會跳成 Safari 視窗。
const PAGES = 'https://gop9632.github.io/open-apps/apps/';
const local = u => location.hostname.endsWith('netlify.app') && String(u).startsWith(PAGES) ? '/apps/' + String(u).slice(PAGES.length) : u;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 上次的清單先畫出來（不用等網路），同時去拿最新的，有變才重畫
const draw = apps => {
  const html = apps.map(a => {
    const web = a.type === 'web';
    const tags = [
      `<span class="tag ${web ? 'web' : ''}">${web ? '網頁版，點開就能用' : esc(a.platform || '電腦') + ' App，要自己裝'}</span>`,
      a.like ? `<span class="tag">取代 ${esc(a.like)}</span>` : ''
    ].join('');
    const actions = web
      ? `<a class="btn primary" href="${esc(local(a.url))}">打開</a>` + (a.guide ? `<a class="btn ghost" href="${esc(local(a.guide))}">使用說明</a>` : '')
      : (a.guide ? `<a class="btn ghost" href="${esc(a.guide)}">完整說明</a>` : '');
    const steps = !web && a.steps ? `<details><summary>怎麼裝</summary><ol>${a.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></details>` : '';
    return `<section class="card"><div class="top"><div class="icon">${esc(a.icon || '📦')}</div><div>
      <h2>${esc(a.name)}</h2><div class="tags">${tags}</div><p>${esc(a.desc)}</p></div></div>
      ${steps}<div class="actions">${actions}</div></section>`;
  }).join('');
  const list = document.getElementById('list');
  if (list.innerHTML !== html) list.innerHTML = html;
};
let cached = null;
try { cached = JSON.parse(localStorage.getItem('portal.apps')); } catch {}
if (cached) draw(cached);
fetch(LIST, { cache: 'no-cache' }).then(r => r.ok ? r.json() : Promise.reject())
  .catch(() => fetch('apps.json').then(r => r.json()))
  .then(apps => { draw(apps); try { localStorage.setItem('portal.apps', JSON.stringify(apps)); } catch {} })
  .catch(() => { if (!cached) document.getElementById('list').textContent = '清單讀取失敗，請重新整理。'; });
// 在入口停留時，先在背景把 app 裝進手機（app 自己的 service worker 會把畫面檔案存起來），
// 點「打開」時就直接從手機打開，不用等網路
if ('serviceWorker' in navigator && location.hostname.endsWith('netlify.app')) {
  const warm = () => ['food-map'].forEach(a => navigator.serviceWorker.register(`/apps/${a}/sw.js`, { scope: `/apps/${a}/` }).catch(() => {}));
  if (window.requestIdleCallback) requestIdleCallback(warm, { timeout: 2000 }); else setTimeout(warm, 800);
}
</script>
</body>
</html>
