<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主持｜第 22 輪制裁：全班一致決</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<style>
body{font-size:clamp(14px,1.05vw,22px)}
.wrap{width:min(94vw,1700px);height:100%;margin:0 auto;position:relative}

/* ===== 大廳 ===== */
#lobby{padding:9vh 0 12vh;justify-content:flex-start}
.lob{display:grid;grid-template-columns:1.25fr 1fr;gap:4vw;align-items:center;width:100%}
.lob h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.6vw,96px);line-height:1.02;margin:.35em 0 .25em;letter-spacing:-.01em}
.lob h1 small{display:block;font-size:.42em;font-family:var(--body);font-weight:900;color:var(--ink);letter-spacing:.02em;margin-top:.35em}
.lob .lead{color:var(--ink2);font-size:1.1em;line-height:1.7;max-width:34em}
.lob .lead b{color:var(--gold)}
.howto{display:flex;gap:1em;margin-top:1.6em;flex-wrap:wrap}
.howto .pill{font-size:.92em}
.howto .pill i{font-style:normal;display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--gold);color:#1b1300;font-weight:900;font-size:.85em}
.joincard{position:relative;border-radius:32px;padding:2.2vw;background:linear-gradient(160deg,rgba(42,75,255,.35),rgba(255,255,255,.04));border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(42,75,255,.7);backdrop-filter:blur(14px);display:grid;grid-template-columns:auto 1fr;gap:1.8vw;align-items:center}
.qr{width:clamp(150px,13vw,300px);aspect-ratio:1;background:#fff;border-radius:18px;padding:12px}
.qr svg{display:block;width:100%;height:100%}
.joincard .lbl{font-size:.9em;color:var(--ink2)}
.joincard .url{font-family:var(--display);font-weight:700;font-size:1.05em;margin:.2em 0 1em;word-break:break-all}
.code{display:flex;gap:.18em}
.code span{display:grid;place-items:center;width:1.15em;height:1.4em;font-family:var(--display);font-weight:800;font-size:clamp(44px,5.4vw,120px);line-height:1;border-radius:.16em;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.code span:nth-child(2){animation-delay:.08s}.code span:nth-child(3){animation-delay:.16s}.code span:nth-child(4){animation-delay:.24s}
.seats{width:100%;margin-top:5vh;flex:1;min-height:0;display:flex;flex-direction:column}
.seats .hd{display:flex;align-items:baseline;gap:.8em;margin-bottom:.8em}
.seats .hd b{font-family:var(--display);font-size:2.2em;font-weight:800;color:var(--gold)}
.seats .hd span{color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:.55em;align-content:flex-start;overflow:hidden;flex:1}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.45em .9em .45em .55em;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;cursor:pointer;transition:background .2s}
.chip:hover{background:rgba(255,77,109,.25);text-decoration:line-through}
.chip .fi{width:1.5em;height:1.1em}
.empty{color:var(--mute);font-style:italic}

/* 底部控制列 */
.ctl{position:fixed;z-index:20;left:0;right:0;bottom:0;height:11vh;min-height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:linear-gradient(0deg,rgba(5,7,26,.92),rgba(5,7,26,0))}
.ctl .l,.ctl .r{display:flex;gap:.7em;align-items:center}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.seg button{padding:.5em .95em;border-radius:10px;color:var(--ink2);font-weight:700;font-size:.9em}
.seg button.on{background:#fff;color:#0b1033}
.ico{width:2.8em;height:2.8em;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:1em}
.ctl .meta{color:var(--mute);font-size:.85em}
#nextBtn kbd{font:inherit;font-size:.75em;opacity:.6;border:1px solid rgba(0,0,0,.3);border-radius:6px;padding:0 .4em;margin-left:.4em}
.resume{position:fixed;z-index:30;top:2vh;left:50%;transform:translateX(-50%);display:flex;gap:1em;align-items:center;padding:.7em .8em .7em 1.3em;border-radius:18px;background:#121a52;border:1px solid var(--line);box-shadow:0 20px 50px -20px #000;animation:rise .5s both}

/* ===== 章節卡 ===== */
#chapter .bigring{position:absolute;width:min(92vh,70vw);aspect-ratio:1;opacity:.22}
#chapter .ct{position:relative;text-align:center}
#chapter .kicker{font-size:1.2em}
#chapter h2{font-family:var(--display);font-weight:800;font-size:clamp(48px,7.5vw,170px);line-height:.95;margin:.25em 0 .1em;letter-spacing:-.02em}
#chapter h3{font-size:clamp(28px,3.4vw,72px);margin:0;font-weight:900}
#chapter p{color:var(--ink2);font-size:1.3em;margin-top:1.2em}
.split span{display:inline-block;opacity:0;animation:rise .6s cubic-bezier(.2,.9,.3,1) forwards}
.split.grad{background:none;color:#fff}
.split.grad span{background:linear-gradient(180deg,#fff 10%,#ffd34d 75%,#ffb000);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== 題目 ===== */
#question,#reveal{justify-content:flex-start;padding:3.5vh 0 12vh}
.qtop{width:100%;display:flex;justify-content:space-between;align-items:center}
.qtop .tag{display:flex;gap:.8em;align-items:center}
.qtop .tag .n{font-family:var(--display);font-weight:800;font-size:1.3em}
.qtop .tag .n em{font-style:normal;color:var(--mute);font-weight:500}
.dbl{display:none;padding:.35em .9em;border-radius:999px;background:linear-gradient(135deg,#ff4d6d,#ffb703);color:#1b0006;font-weight:900;animation:pulse 1.2s ease-in-out infinite}
.dbl.show{display:inline-block}
.answered{display:flex;align-items:center;gap:.7em}
.answered b{font-family:var(--display);font-size:2em;font-weight:800}
.answered .flags{display:flex}
.answered .flags .fi{width:1.6em;height:1.2em;margin-left:-.45em;animation:pop .4s both}
.qmid{flex:1;width:100%;display:grid;grid-template-columns:auto 1fr;gap:3vw;align-items:center;min-height:0}
.timer{width:clamp(150px,15vw,300px);aspect-ratio:1}
.timer .num{font-size:clamp(46px,4.5vw,96px)}
.timer.hot .num{color:#ff6b6b;animation:pulse .5s ease-in-out infinite}
.qtext{font-size:clamp(28px,3.1vw,64px);font-weight:900;line-height:1.3;letter-spacing:.01em;text-wrap:balance}
.qtext.long{font-size:clamp(24px,2.6vw,54px)}
.opts{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:1.2vw}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:1em;min-height:12vh;padding:1.1em 1.4em;border-radius:22px;background:var(--c);color:#fff;font-size:clamp(18px,1.7vw,36px);font-weight:900;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 18px 40px -20px var(--c);animation:rise .5s cubic-bezier(.2,.9,.3,1) both;transition:opacity .5s,transform .5s,filter .5s}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
.opt .shape{display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:12px;background:rgba(0,0,0,.18);flex:none}
.opt .tx{position:relative;z-index:1;flex:1;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22);transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.opt .cnt{position:relative;z-index:1;font-family:var(--display);font-weight:800;font-size:1.2em;opacity:0;transition:opacity .4s .3s}
.opt .chk{position:relative;z-index:1;display:none;font-size:1.1em}
.opts.rev .opt{animation:none}
.opts.rev .opt .cnt{opacity:1}
.opts.rev .opt.no{opacity:.28;filter:saturate(.4);transform:scale(.97)}
.opts.rev .opt.yes{transform:scale(1.03);box-shadow:0 0 0 4px #fff,0 0 60px 10px var(--c)}
.opts.rev .opt.yes .chk{display:inline;animation:pop .5s .4s both}
.opts.poll{grid-template-columns:1fr 1fr}
.opts.poll .opt{min-height:16vh}

.verdict{position:relative;width:clamp(150px,15vw,300px);aspect-ratio:1;display:grid;place-items:center}
.verdict .stamp{font-size:clamp(26px,2.6vw,56px);position:relative}
.vtext{font-size:1.3em;color:var(--ink2);margin-top:.4em;line-height:1.6}
.vtext b{color:var(--ink)}
.meter{height:14px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:.8em 0 .3em;max-width:34em;display:flex}
.meter i{display:block;height:100%;transition:width 1.4s cubic-bezier(.2,.9,.3,1)}
.why{margin-top:2.2vh;width:100%;padding:1em 1.4em;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-left:6px solid var(--gold);font-size:1.15em;line-height:1.6;animation:rise .6s .6s both}
.why b{color:var(--gold);margin-right:.6em}

/* ===== 排行榜 ===== */
#board{padding:4vh 0 12vh;justify-content:flex-start}
#board h2{font-family:var(--display);font-size:clamp(34px,3.6vw,78px);margin:.1em 0 .5em;font-weight:800}
.rows{position:relative;width:min(1100px,90vw);flex:1}
.row{position:absolute;left:0;right:0;height:calc(var(--rh) - 10px);display:flex;align-items:center;gap:1em;padding:0 1.4em;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:clamp(16px,1.5vw,30px);transition:top .9s cubic-bezier(.3,1.2,.4,1),opacity .5s,background .4s}
.row.r1{background:linear-gradient(90deg,rgba(255,204,51,.35),rgba(255,204,51,.06));border-color:rgba(255,204,51,.6)}
.row.r2{background:linear-gradient(90deg,rgba(200,215,255,.25),rgba(255,255,255,.05))}
.row.r3{background:linear-gradient(90deg,rgba(255,150,90,.25),rgba(255,255,255,.05))}
.row .rk{width:1.8em;font-family:var(--display);font-weight:800;font-size:1.3em;text-align:center}
.row .fi{width:1.9em;height:1.4em}
.row .nm{font-weight:900;flex:1;display:flex;align-items:baseline;gap:.6em;min-width:0}
.row .nm small{color:var(--ink2);font-weight:500;font-size:.65em}
.row .fire{color:#ffb703;font-weight:900;font-size:.8em}
.row .dl{color:var(--ok);font-weight:800;font-size:.8em;min-width:4.5em;text-align:right}
.row .sc{font-family:var(--display);font-weight:800;font-size:1.25em;min-width:4.5em;text-align:right}
.unan{margin-top:1vh;color:var(--ink2)}
.unan b{color:var(--gold)}

/* ===== 頒獎台 ===== */
#final{justify-content:flex-end;padding-bottom:12vh}
#final .kicker{position:absolute;top:5vh}
#final h2{position:absolute;top:8vh;font-family:var(--display);font-size:clamp(40px,4.4vw,92px);margin:0;font-weight:800}
.podium{display:flex;align-items:flex-end;gap:1.6vw;height:60vh}
.pcol{width:clamp(160px,16vw,320px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pwho{text-align:center;margin-bottom:1em;opacity:0;animation:pop .6s cubic-bezier(.2,1.5,.4,1) forwards}
.pwho .fi{width:4.2em;height:3.1em;border-radius:8px;box-shadow:0 10px 30px -8px #000}
.pwho .pn{font-weight:900;font-size:clamp(20px,2vw,42px);margin-top:.3em}
.pwho .ps{color:var(--ink2);font-family:var(--display);font-weight:700}
.pblock{width:100%;border-radius:20px 20px 0 0;display:grid;place-items:start center;padding-top:.6em;font-family:var(--display);font-weight:800;font-size:clamp(50px,5vw,110px);color:rgba(0,0,0,.45);height:0;transition:height 1.1s cubic-bezier(.2,1.1,.3,1)}
.p1 .pblock{background:linear-gradient(180deg,#ffe28a,#ffb000)}
.p2 .pblock{background:linear-gradient(180deg,#eef2ff,#9aa6d6)}
.p3 .pblock{background:linear-gradient(180deg,#ffc29a,#d9733b)}
.fstat{display:flex;gap:1.2em;margin-top:2vh}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<canvas id="confetti"></canvas>
<div class="conn" id="conn">連線中斷，正在重新連線…</div>
<div class="app wrap">

  <section class="screen on" id="lobby">
    <div class="lob">
      <div>
        <div class="kicker">EU Sanctions against Russia · 歐盟概論</div>
        <h1><span class="grad">第 22 輪制裁</span><small>全班一致決大挑戰</small></h1>
        <p class="lead">每個人入席後都會代表一個<b>歐盟會員國</b>。答對越快分數越高；全班都答對（或棄權）就是<b>「一致決通過」</b>，只要一國答錯就會被否決。每人還有一張<b>「建設性棄權」</b>卡，用了不扣分、連勝也不會斷。</p>
        <div class="howto">
          <span class="pill"><i>1</i>手機掃 QR code</span>
          <span class="pill"><i>2</i>輸入暱稱入席</span>
          <span class="pill"><i>3</i>看大螢幕，用手機作答</span>
        </div>
      </div>
      <div class="joincard">
        <div class="qr" id="qr"></div>
        <div>
          <div class="lbl">或打開網址</div>
          <div class="url" id="joinUrl"></div>
          <div class="lbl">房號</div>
          <div class="code" id="code"></div>
        </div>
      </div>
    </div>
    <div class="seats">
      <div class="hd"><b id="pcount">0</b><span>位代表已入席　·　點名字可以請他離席</span></div>
      <div class="chips" id="chips"><span class="empty">等待第一位代表入席…</span></div>
    </div>
  </section>

  <section class="screen" id="chapter">
    <div class="bigring" id="chRing"></div>
    <div class="ct">
      <div class="kicker" id="chTag"></div>
      <h2 class="grad split" id="chEn"></h2>
      <h3 class="split" id="chZh"></h3>
      <p id="chSub"></p>
    </div>
  </section>

  <section class="screen" id="question">
    <div class="qtop">
      <div class="tag"><span class="n" id="qN"></span><span class="pill" id="qCh"></span><span class="dbl" id="qDbl">最終表決 · 分數 ×2</span></div>
      <div class="answered"><div class="flags" id="ansFlags"></div><b id="ansN">0</b><span id="ansOf"></span></div>
    </div>
    <div class="qmid">
      <div class="timer" id="timer"></div>
      <div class="qtext" id="qText"></div>
    </div>
    <div class="opts" id="opts"></div>
  </section>

  <section class="screen" id="reveal">
    <div class="qtop">
      <div class="tag"><span class="n" id="rN"></span><span class="pill" id="rCh"></span></div>
      <div class="answered"><span id="rSum"></span></div>
    </div>
    <div class="qmid">
      <div class="verdict" id="verdict"></div>
      <div>
        <div class="qtext" id="rText"></div>
        <div id="vBox"></div>
      </div>
    </div>
    <div class="opts rev" id="rOpts"></div>
    <div class="why" id="why"></div>
  </section>

  <section class="screen" id="board">
    <div class="kicker" id="bKick">LEADERBOARD</div>
    <h2 class="grad">目前排行</h2>
    <div class="rows" id="rows"></div>
    <div class="unan" id="unan"></div>
  </section>

  <section class="screen" id="final">
    <div class="kicker">RESOLUTION ADOPTED · 決議通過</div>
    <h2 class="grad">最佳代表</h2>
    <div class="podium" id="podium"></div>
    <div class="fstat" id="fstat"></div>
  </section>
</div>

<div class="ctl">
  <div class="l" id="ctlL">
    <div class="seg" id="segMode"><button data-v="core" class="on">精華版</button><button data-v="full">完整版</button></div>
    <div class="seg" id="segSec"><button data-v="15">15 秒</button><button data-v="20" class="on">20 秒</button><button data-v="30">30 秒</button></div>
    <span class="meta" id="modeMeta"></span>
  </div>
  <div class="r">
    <button class="ico" id="sndBtn" title="音效">🔊</button>
    <button class="ico" id="fsBtn" title="全螢幕 (F)">⛶</button>
    <button class="btn" id="nextBtn">開始遊戲<kbd>空白鍵</kbd></button>
  </div>
</div>

<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  var D = EU_DATA, U = EU_UTIL, $ = function (s) { return document.querySelector(s); };
  EU_sky($('#sky'));
  var JOIN = location.href.replace(/host\.html.*$/, '');
  var SAVE_KEY = 'eu-host-v1';

  // ---------- 狀態 ----------
  var S = null;
  function fresh() {
    return { room: String(Math.floor(1000 + Math.random() * 9000)), mode: 'core', secs: 20, steps: [], step: -1, phase: 'lobby',
      players: {}, answers: {}, left: 0, unan: 0, scored: 0, polls: [], ts: Date.now(), cc: 0 };
  }
  function save() { if (hold) { if (S && Object.keys(S.players).length && window._dropResume) window._dropResume(); else return; } try { S.ts = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

  function buildSteps() {
    var qs = D.questions.map(function (q, i) { return i; }).filter(function (i) { return S.mode === 'full' || D.questions[i].core; });
    var scoredIdx = qs.filter(function (i) { return !D.questions[i].poll; });
    var lastScored = scoredIdx[scoredIdx.length - 1], steps = [], prevCh = null, n = 0, total = scoredIdx.length;
    qs.forEach(function (i) {
      var q = D.questions[i];
      if (q.ch !== prevCh) { steps.push({ t: 'chapter', ch: q.ch }); prevCh = q.ch; }
      if (!q.poll) n++;
      steps.push({ t: 'q', qi: i, n: n, total: total, dbl: i === lastScored });
      if (!q.poll) steps.push({ t: 'board' });
    });
    steps.push({ t: 'final' });
    return steps;
  }
  function updateMeta() {
    var qs = D.questions.filter(function (q) { return S.mode === 'full' || q.core; });
    var sc = qs.filter(function (q) { return !q.poll; }).length, pl = qs.length - sc;
    $('#modeMeta').textContent = sc + ' 題搶答＋' + pl + ' 題全班投票 · 約 ' + Math.round(qs.length * (S.secs + 22) / 60) + ' 分鐘';
  }

  // ---------- 連線 ----------
  var net;
  function connect() {
    net = EU_connect(S.room, onMsg, function (st) {
      $('#conn').classList.toggle('show', st !== 'SUBSCRIBED');
      if (st === 'SUBSCRIBED') pushState(true);
      if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setTimeout(function () { location.reload(); }, 4000);
    });
  }
  var pushTimer = null;
  function pushState(now) {
    if (now) { clearTimeout(pushTimer); pushTimer = null; net && net.send(pub()); return; }
    if (!pushTimer) pushTimer = setTimeout(function () { pushTimer = null; net && net.send(pub()); }, 350);
  }
  setInterval(function () { pushState(true); }, 2500);

  function pub() {
    var st = S.steps[S.step] || {}, o = { t: 'state', room: S.room, phase: S.phase, step: S.step, pl: {} };
    Object.keys(S.players).forEach(function (id) { var p = S.players[id]; o.pl[id] = [p.n, p.cc, p.s, p.st, p.ab ? 1 : 0, p.lp || 0, p.lr || '']; });
    if (st.ch || st.qi !== undefined) {
      var chId = st.ch || D.questions[st.qi].ch, c = D.chapters.find(function (x) { return x.id === chId; });
      o.ch = { tag: c.tag, en: c.en, zh: c.zh };
    }
    if (st.t === 'q') {
      var q = D.questions[st.qi];
      o.q = { text: q.q, a: q.a, poll: !!q.poll, n: st.n, total: st.total, dbl: !!st.dbl };
      if (S.phase === 'q') { o.left = Math.max(0, S.qEnd - Date.now()); o.dur = S.secs * 1000 + (q.poll ? 5000 : 0); o.got = Object.keys(S.answers); }
      if (S.phase === 'reveal') { o.correct = q.poll ? -1 : q.answer; o.counts = S.counts; o.unan = S.lastUnan; }
    }
    if (S.phase === 'final') o.unanTotal = [S.unan, S.scored];
    return o;
  }

  function onMsg(m) {
    if (!m || !m.pid) return;
    if (m.t === 'hello') {
      var p = S.players[m.pid];
      var name = String(m.name || '').trim().slice(0, 12) || '代表';
      if (!p) {
        if (S.kicked && S.kicked[m.pid]) return;
        var cc = D.countries[S.cc % D.countries.length][0]; S.cc++;
        p = S.players[m.pid] = { n: name, cc: cc, s: 0, st: 0, ab: false, joined: Date.now() };
        sfx.join();
      } else p.n = name;
      save(); renderLobby(); pushState();
      if (S.phase === 'q') renderAnswered();
    } else if (m.t === 'ans') {
      if (S.phase !== 'q' || m.step !== S.step || !S.players[m.pid] || S.answers[m.pid]) return;
      var st = S.steps[S.step], q = D.questions[st.qi];
      if (m.c === 'ab') { if (S.players[m.pid].ab || q.poll) return; S.players[m.pid].ab = true; }
      else if (!(m.c >= 0 && m.c < q.a.length)) return;
      S.answers[m.pid] = { c: m.c, t: Math.max(0, S.qEnd - Date.now()) };
      save(); renderAnswered(); pushState(); sfx.blip();
      if (Object.keys(S.answers).length >= Object.keys(S.players).length) setTimeout(reveal, 600);
    }
  }

  // ---------- 畫面 ----------
  function show(id) { document.querySelectorAll('.screen').forEach(function (s) { s.classList.toggle('on', s.id === id); }); }
  function splitText(el, txt, base) {
    el.innerHTML = Array.from(txt).map(function (ch, i) { return '<span style="animation-delay:' + ((base || 0) + i * 0.035).toFixed(3) + 's">' + (ch === ' ' ? '&nbsp;' : U.esc(ch)) + '</span>'; }).join('');
  }

  function renderLobby() {
    var ids = Object.keys(S.players).sort(function (a, b) { return S.players[a].joined - S.players[b].joined; });
    $('#pcount').textContent = ids.length;
    var box = $('#chips');
    if (!ids.length) { box.innerHTML = '<span class="empty">等待第一位代表入席…</span>'; return; }
    var have = {}; box.querySelectorAll('.chip').forEach(function (c) { have[c.dataset.id] = c; });
    if (box.querySelector('.empty')) box.innerHTML = '';
    Object.keys(have).forEach(function (id) { if (!S.players[id]) have[id].remove(); });
    ids.forEach(function (id) {
      var p = S.players[id], html = U.flag(p.cc) + U.esc(p.n);
      if (have[id]) { if (have[id].innerHTML !== html) have[id].innerHTML = html; return; }
      var c = document.createElement('button'); c.className = 'chip'; c.dataset.id = id; c.innerHTML = html; c.title = '請他離席';
      c.onclick = function () { kick(id); };
      box.appendChild(c);
    });
  }
  function kick(id) {
    S.kicked = S.kicked || {}; S.kicked[id] = 1; delete S.players[id]; delete S.answers[id];
    save(); renderLobby(); pushState(true);
  }

  function qr() {
    var url = JOIN + '?room=' + S.room, q = qrcode(0, 'M'); q.addData(url); q.make();
    var n = q.getModuleCount(), d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
    $('#qr').innerHTML = '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges"><path d="' + d + '" fill="#0b1033"/></svg>';
    $('#joinUrl').textContent = JOIN.replace(/^https?:\/\//, '');
    $('#code').innerHTML = S.room.split('').map(function (x) { return '<span>' + x + '</span>'; }).join('');
  }

  var chRing = EU_ring($('#chRing')); $('#chRing').classList.add('spin');
  var timerRing = EU_ring($('#timer'), '');
  var chTimer;
  function renderChapter() {
    var c = D.chapters.find(function (x) { return x.id === S.steps[S.step].ch; });
    $('#chTag').textContent = c.tag;
    splitText($('#chEn'), c.en, .15); splitText($('#chZh'), c.zh, .15 + c.en.length * .035);
    $('#chSub').textContent = c.sub; $('#chSub').style.animation = 'none'; void $('#chSub').offsetWidth; $('#chSub').style.animation = 'rise .7s 1s both';
    chRing.set(0); var k = 0; clearInterval(chTimer);
    chTimer = setInterval(function () { chRing.set(++k); if (k >= 12) clearInterval(chTimer); }, 70);
    show('chapter'); sfx.whoosh();
    clearTimeout(S._auto); S._auto = setTimeout(next, 4200);
  }

  function chapterOf(st) { var id = st.ch || D.questions[st.qi].ch; return D.chapters.find(function (x) { return x.id === id; }); }
  function optHTML(q, i) {
    return '<div class="opt o' + i + '"><div class="bar"></div><span class="shape">' + U.shapes[i] + '</span><span class="tx">' + U.esc(q.a[i]) + '</span><span class="cnt"></span><span class="chk">✅</span></div>';
  }
  var tick;
  function renderQuestion(resume) {
    var st = S.steps[S.step], q = D.questions[st.qi], c = chapterOf(st);
    if (!resume) { S.answers = {}; S.qEnd = Date.now() + S.secs * 1000 + (q.poll ? 5000 : 0); }
    else S.qEnd = Date.now() + (S.left || S.secs * 1000);
    $('#qN').innerHTML = q.poll ? '全班投票' : '第 ' + st.n + ' <em>/ ' + st.total + ' 題</em>';
    $('#qCh').textContent = c.tag + ' · ' + c.en;
    $('#qDbl').classList.toggle('show', !!st.dbl);
    $('#qText').textContent = q.q; $('#qText').classList.toggle('long', q.q.length > 34);
    $('#opts').className = 'opts' + (q.poll ? ' poll' : '');
    $('#opts').innerHTML = q.a.map(function (_, i) { return optHTML(q, i); }).join('');
    renderAnswered(); show('question'); sfx.start();
    var dur = S.qEnd - Date.now(), total = S.secs * 1000 + (q.poll ? 5000 : 0), lastSec = -1;
    clearInterval(tick);
    tick = setInterval(function () {
      var left = Math.max(0, S.qEnd - Date.now()); S.left = left;
      var sec = Math.ceil(left / 1000);
      timerRing.set(Math.ceil(left / total * 12)); timerRing.num.textContent = sec;
      $('#timer').classList.toggle('hot', sec <= 5);
      if (sec !== lastSec) { lastSec = sec; if (sec <= 5 && sec > 0) sfx.tick(); }
      if (left <= 0) { clearInterval(tick); reveal(); }
    }, 100);
    save(); pushState(true);
  }
  function renderAnswered() {
    var ids = Object.keys(S.answers), tot = Object.keys(S.players).length;
    $('#ansN').textContent = ids.length; $('#ansOf').textContent = '/ ' + tot + ' 已作答';
    $('#ansFlags').innerHTML = ids.slice(-8).map(function (id) { return S.players[id] ? U.flag(S.players[id].cc) : ''; }).join('');
  }

  function reveal() {
    if (S.phase !== 'q') return;
    clearInterval(tick); S.phase = 'reveal';
    var st = S.steps[S.step], q = D.questions[st.qi], total = S.secs * 1000;
    var counts = q.a.map(function () { return 0; }), ok = 0, bad = 0, ab = 0, none = 0;
    Object.keys(S.players).forEach(function (id) {
      var p = S.players[id], a = S.answers[id];
      p.lp = 0;
      if (q.poll) { p.lr = ''; if (a && a.c !== 'ab') counts[a.c]++; return; }
      if (!a) { none++; p.st = 0; p.lr = 'none'; return; }
      if (a.c === 'ab') { ab++; p.lr = 'ab'; return; }
      counts[a.c]++;
      if (a.c === q.answer) {
        ok++; p.st++;
        var pts = Math.round(500 + 500 * Math.min(1, a.t / total)) + Math.min(p.st - 1, 3) * 100;
        if (st.dbl) pts *= 2;
        p.lp = pts; p.s += pts; p.lr = 'ok';
      } else { bad++; p.st = 0; p.lr = 'bad'; }
    });
    S.counts = counts;
    var n = Object.keys(S.players).length;
    if (!q.poll) { S.scored++; S.lastUnan = n > 0 && bad === 0 && none === 0 && ok > 0; if (S.lastUnan) S.unan++; }
    if (q.poll) S.polls.push({ q: q.q, a: q.a, counts: counts });
    S.lastR = { ok: ok, bad: bad, ab: ab, none: none, n: n };
    $('#nextBtn').innerHTML = (q.poll ? '下一步' : '看排行') + '<kbd>空白鍵</kbd>';
    renderReveal(q, st, S.lastR);
    save(); pushState(true);
  }

  function renderReveal(q, st, r) {
    var c = chapterOf(st), counts = S.counts, max = Math.max(1, Math.max.apply(null, counts)), sum = counts.reduce(function (a, b) { return a + b; }, 0);
    $('#rN').innerHTML = q.poll ? '全班投票結果' : '第 ' + st.n + ' <em>/ ' + st.total + ' 題</em>';
    $('#rCh').textContent = c.tag + ' · ' + c.en;
    $('#rText').textContent = q.q; $('#rText').classList.toggle('long', q.q.length > 34);
    $('#rOpts').className = 'opts rev' + (q.poll ? ' poll' : '');
    $('#rOpts').innerHTML = q.a.map(function (_, i) { return optHTML(q, i); }).join('');
    var tiles = $('#rOpts').querySelectorAll('.opt');
    tiles.forEach(function (t, i) {
      if (!q.poll) t.classList.add(i === q.answer ? 'yes' : 'no');
      t.querySelector('.cnt').textContent = q.poll ? (sum ? Math.round(counts[i] / sum * 100) : 0) + '%' : counts[i];
      setTimeout(function () { t.querySelector('.bar').style.width = (q.poll ? (sum ? counts[i] / sum : 0) : counts[i] / max) * 100 + '%'; }, 80);
    });
    var v = $('#verdict'), box = $('#vBox');
    if (q.poll) {
      v.innerHTML = '<div class="timer" id="pRing"></div>';
      var pr = EU_ring($('#pRing'), '<span style="font-size:.6em">' + sum + '<br><small style="font-size:.4em;color:var(--ink2)">票</small></span>'); pr.set(12);
      box.innerHTML = '<div class="vtext">沒有標準答案。<b>' + U.esc(q.a[counts[0] >= counts[1] ? 0 : 1].split('：')[0]) + '</b> 的人比較多，你同意嗎？可以請兩邊各派一位說說看。</div>';
      $('#why').style.display = 'none'; $('#rSum').textContent = '';
      sfx.chime(true);
    } else {
      var pass = S.lastUnan;
      v.innerHTML = '<div class="stamp ' + (pass ? 'ok' : 'bad') + '">' + (pass ? '一致決<br>通過' : '否決') + '</div>';
      setTimeout(function () { v.querySelector('.stamp').classList.add('go'); sfx.stamp(); }, 500);
      var n = Math.max(1, r.n);
      box.innerHTML = '<div class="meter"><i style="width:0;background:var(--ok)"></i><i style="width:0;background:#8a93c9"></i><i style="width:0;background:var(--bad)"></i></div>' +
        '<div class="vtext">' + (pass ? '27 國精神！所有代表都答對或建設性棄權，<b>全體一致通過</b>。' : '<b>' + (r.bad + r.none) + ' 國</b>答錯或沒投票，決議被擋下。這就是一致決的難處！') +
        (r.ab ? '　' + r.ab + ' 國使用建設性棄權。' : '') + '</div>';
      setTimeout(function () {
        var m = box.querySelectorAll('.meter i');
        m[0].style.width = r.ok / n * 100 + '%'; m[1].style.width = r.ab / n * 100 + '%'; m[2].style.width = (r.bad + r.none) / n * 100 + '%';
      }, 120);
      $('#why').style.display = ''; $('#why').innerHTML = '<b>出自簡報</b>' + U.esc(q.why || '');
      $('#rSum').innerHTML = '<span class="pill">✅ ' + r.ok + '　❌ ' + (r.bad + r.none) + '　🛡️ ' + r.ab + '</span>';
      sfx.chime(pass);
    }
    show('reveal');
  }

  var lastOrder = [];
  function ranked() {
    return Object.keys(S.players).sort(function (a, b) { return S.players[b].s - S.players[a].s || S.players[a].joined - S.players[b].joined; });
  }
  function renderBoard() {
    var ids = ranked(), top = ids.slice(0, 7), box = $('#rows');
    var rh = Math.min(box.clientHeight / 7, innerHeight * .085) || 70; box.style.setProperty('--rh', rh + 'px');
    box.innerHTML = '';
    var st = S.steps[S.step - 1] || {};
    $('#bKick').textContent = st.n ? 'LEADERBOARD · 第 ' + st.n + ' / ' + st.total + ' 題後' : 'LEADERBOARD';
    top.forEach(function (id, i) {
      var p = S.players[id], prev = lastOrder.indexOf(id), from = prev >= 0 && prev < 7 ? prev : 8;
      var el = document.createElement('div'); el.className = 'row' + (i < 3 ? ' r' + (i + 1) : '');
      el.style.top = from * rh + 'px'; el.style.opacity = from >= 7 ? 0 : 1;
      el.innerHTML = '<span class="rk">' + (i + 1) + '</span>' + U.flag(p.cc) + '<span class="nm">' + U.esc(p.n) + '<small>' + U.countryName(p.cc) + '</small></span>' +
        (p.st >= 2 ? '<span class="fire">🔥 ' + p.st + ' 連勝</span>' : '') + '<span class="dl">' + (p.lp ? '+' + p.lp : '') + '</span><span class="sc">' + (p.s - (p.lp || 0)) + '</span>';
      box.appendChild(el);
      setTimeout(function () { el.style.top = i * rh + 'px'; el.style.opacity = 1; countUp(el.querySelector('.sc'), p.s - (p.lp || 0), p.s); }, 450 + i * 60);
    });
    if (!top.length) box.innerHTML = '<p class="empty" style="text-align:center">還沒有人入席</p>';
    lastOrder = ids;
    $('#unan').innerHTML = '全班一致決通過：<b>' + S.unan + '</b> / ' + S.scored + ' 題';
    show('board'); sfx.whoosh();
  }
  function countUp(el, a, b) {
    var t0 = performance.now(), d = 900;
    (function f(t) { var k = Math.min(1, (t - t0) / d); el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
  }

  function renderFinal() {
    var ids = ranked(), order = [1, 0, 2], hs = ['44vh', '32vh', '24vh'];
    $('#podium').innerHTML = order.map(function (k) {
      var id = ids[k]; if (!id) return '<div class="pcol"></div>';
      var p = S.players[id];
      return '<div class="pcol p' + (k + 1) + '"><div class="pwho" style="animation-delay:' + (k === 0 ? 2.2 : k === 1 ? 1.4 : .8) + 's">' + U.flag(p.cc) + '<div class="pn">' + U.esc(p.n) + '</div><div class="ps">' + U.countryName(p.cc) + ' · ' + p.s + ' 分</div></div><div class="pblock" data-h="' + hs[k] + '">' + (k + 1) + '</div></div>';
    }).join('');
    setTimeout(function () { $('#podium').querySelectorAll('.pblock').forEach(function (b) { b.style.height = b.dataset.h; }); }, 200);
    var pollTxt = S.polls.map(function (p) { var s = p.counts[0] + p.counts[1]; return '<span class="pill">🗳️ ' + U.esc(p.a[0].split('：')[0]) + ' ' + (s ? Math.round(p.counts[0] / s * 100) : 0) + '%</span>'; }).join('');
    $('#fstat').innerHTML = '<span class="pill">🇪🇺 ' + ids.length + ' 位代表</span><span class="pill">🤝 一致決通過 ' + S.unan + ' / ' + S.scored + ' 題</span>' + pollTxt;
    show('final'); sfx.fanfare();
    setTimeout(function () { EU_confetti($('#confetti'), 7000); }, 2300);
  }

  // ---------- 流程 ----------
  function next() {
    clearTimeout(S._auto);
    if (S.phase === 'q') { reveal(); return; }
    if (S.phase === 'lobby') {
      S.steps = buildSteps(); S.step = -1;
    }
    if (S.phase === 'final') { if (confirm('結束這場、開新房間？')) { localStorage.removeItem(SAVE_KEY); location.href = location.pathname; } return; }
    S.step++;
    var st = S.steps[S.step];
    S.phase = st.t === 'q' ? 'q' : st.t;
    enter(false);
  }
  function enter(resume) {
    var st = S.steps[S.step];
    document.body.classList.toggle('playing', S.phase !== 'lobby');
    $('#ctlL').style.visibility = S.phase === 'lobby' ? 'visible' : 'hidden';
    if (S.phase === 'lobby') { show('lobby'); $('#nextBtn').innerHTML = '開始遊戲<kbd>空白鍵</kbd>'; }
    else if (S.phase === 'chapter') renderChapter();
    else if (S.phase === 'q') renderQuestion(resume);
    else if (S.phase === 'reveal') renderReveal(D.questions[st.qi], st, S.lastR || { ok: 0, bad: 0, ab: 0, none: 0, n: 0 });
    else if (S.phase === 'board') renderBoard();
    else if (S.phase === 'final') renderFinal();
    if (S.phase !== 'lobby') $('#nextBtn').innerHTML = (S.phase === 'q' ? '直接公布' : S.phase === 'final' ? '再玩一場' : '下一步') + '<kbd>空白鍵</kbd>';
    save(); pushState(true);
  }

  // ---------- 音效（WebAudio，免檔案） ----------
  var AC = null, muted = false;
  function tone(f, d, type, vol, when) {
    if (muted) return; try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .15, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05);
    } catch (e) {}
  }
  var sfx = {
    join: function () { tone(880, .15, 'triangle', .12); tone(1320, .2, 'triangle', .1, .07); },
    blip: function () { tone(660, .08, 'sine', .06); },
    tick: function () { tone(1000, .07, 'square', .05); },
    start: function () { [523, 659, 784].forEach(function (f, i) { tone(f, .2, 'triangle', .1, i * .08); }); },
    whoosh: function () { tone(220, .5, 'sine', .08); tone(330, .4, 'sine', .06, .1); },
    stamp: function () { tone(90, .25, 'square', .18); },
    chime: function (ok) { (ok ? [784, 988, 1175, 1568] : [392, 330, 262]).forEach(function (f, i) { tone(f, .35, 'triangle', .12, .5 + i * .1); }); },
    fanfare: function () { [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { tone(f, .4, 'sawtooth', .07, .8 + i * .15); }); }
  };

  // ---------- 控制 ----------
  $('#nextBtn').onclick = next;
  addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') { e.preventDefault(); next(); }
    if (e.code === 'KeyF') toggleFs();
  });
  function toggleFs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  $('#fsBtn').onclick = toggleFs;
  $('#sndBtn').onclick = function () { muted = !muted; this.textContent = muted ? '🔇' : '🔊'; };
  function seg(id, key, num) {
    $(id).querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { S[key] = num ? +b.dataset.v : b.dataset.v; $(id).querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); updateMeta(); save(); };
    });
  }
  seg('#segMode', 'mode'); seg('#segSec', 'secs', true);
  function syncSeg() {
    ['#segMode', '#segSec'].forEach(function (id, k) { $(id).querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === String(k ? S.secs : S.mode)); }); });
  }

  // ---------- 啟動 ----------
  var saved = null, hold = false;
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
  var resumable = saved && Date.now() - saved.ts < 3 * 3600 * 1000 && Object.keys(saved.players || {}).length && saved.phase !== 'final';
  if (/resume=1/.test(location.search) && resumable) {
    history.replaceState(null, '', location.pathname);
    S = saved; syncSeg(); updateMeta(); qr(); renderLobby(); connect(); enter(true);
  } else {
    S = fresh(); syncSeg(); updateMeta(); qr(); renderLobby(); connect();
    if (resumable) {
      hold = true;
      var bar = document.createElement('div'); bar.className = 'resume';
      bar.innerHTML = '<span>上一場（房號 ' + saved.room + '，' + Object.keys(saved.players).length + ' 人）還沒結束</span><button class="btn" id="rsY">繼續上一場</button><button class="btn ghost" id="rsN">開新房間</button>';
      document.body.appendChild(bar);
      $('#rsY').onclick = function () { location.href = location.pathname + '?resume=1'; };
      $('#rsN').onclick = function () { bar.remove(); hold = false; save(); };
      window._dropResume = function () { if (hold) { bar.remove(); hold = false; } };
    }
  }
})();
</script>
