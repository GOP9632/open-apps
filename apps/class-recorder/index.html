<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>課堂錄音</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="課堂錄音">
<style>
:root{--bg:#f7f8fa;--panel:#fff;--side:#f1f3f6;--text:#1d2129;--muted:#6b7280;--line:#e5e7eb;--accent:#3b5bdb;--accent-soft:#edf2ff;--danger:#d93025;--teacher:#0b7a3e;--teacher-soft:#e6f4ea;--warn:#a15c00;--hl:#fff3a3;--kw:#ffd8a8;--rec:#e03131}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--panel:#1a1e24;--side:#15191e;--text:#e6e8eb;--muted:#9aa3ad;--line:#2b313a;--accent:#748ffc;--accent-soft:#1f2747;--danger:#ff6b5e;--teacher:#5fd38d;--teacher-soft:#15301f;--warn:#e0a23a;--hl:#5c5214;--kw:#6b4210;--rec:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
/* iPhone 會把小於 16px 的輸入框自動放大，而且不會縮回來，所以輸入框一律 16px 以上 */
select,input,textarea{font-size:16px}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{background:var(--accent-soft);color:var(--text)}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
a{color:var(--accent)}
h1{font-size:17px;margin:0}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hidden{display:none!important}
.err{color:var(--danger);font-size:13px;white-space:pre-wrap}
.note{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* 版面：左側欄、上方工具列、主畫面 */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside#aside{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;height:100vh;position:sticky;top:0;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 10px;cursor:pointer}
.nav{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;align-items:center}
.nav:hover{background:var(--accent-soft)}
.nav.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{color:var(--muted);font-size:12px}
.side-h{display:flex;align-items:center;justify-content:space-between;margin:14px 10px 4px;font-size:12px;color:var(--muted);font-weight:600}
.side-h button{padding:0 8px;font-size:16px;line-height:22px}
.side-foot{margin-top:auto;padding-top:12px}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;gap:8px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line)}
.topbar .search{max-width:420px;border-radius:99px;padding:8px 14px;background:var(--panel)}
.menu-btn{display:none}
main{padding:20px 24px 110px;width:100%}
.narrow{max-width:900px}
#scrim{display:none}

/* 首頁清單 */
.day{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .1s,box-shadow .1s}
.sess:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.sess .t1{display:flex;gap:8px;align-items:baseline}
.sess .t1 b{flex:1;font-size:16px}
.sess .pv{color:var(--muted);font-size:14px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .big{font-size:40px}
details.fset{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
details.fset summary{cursor:pointer;font-weight:600}

/* 單一錄音 */
.sess-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.sess-layout.one{grid-template-columns:minmax(0,1fr)}
.title-input{font-size:22px;font-weight:700;border:0;padding:4px 0;background:transparent;border-radius:0}
.title-input:focus{outline:none;border-bottom:2px solid var(--accent)}
.folder-sel{width:auto;padding:3px 8px}
.speakers,.kws{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.spk{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:3px 10px 3px 3px;font-size:13px}
.av{width:24px;height:24px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.chip{border-radius:99px;padding:3px 11px;font-size:13px}
.chip.on{background:var(--kw);border-color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 14px;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.ncard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.ncard h3{display:flex;align-items:center;gap:8px}
.ncard ul{margin:4px 0;padding-left:20px}
.ncard p{margin:4px 0}
.ts{color:var(--accent);cursor:pointer;font-variant-numeric:tabular-nums;font-size:13px;text-decoration:none;white-space:nowrap}
.ts:hover{text-decoration:underline}
.todo{display:flex;gap:8px;align-items:flex-start;margin:6px 0;color:var(--text);font-size:15px}
.todo input{width:auto;margin-top:5px}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.todo .x{margin-left:auto;padding:0 6px;visibility:hidden}
.todo:hover .x{visibility:visible}
.ol{margin:10px 0}
.ol b{margin-left:6px}
details.qa{border-top:1px solid var(--line);padding:8px 0}
details.qa summary{cursor:pointer}
details.qa div{color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toggle{display:inline-flex;gap:6px;align-items:center;margin:0;font-size:13px;color:var(--text);cursor:pointer}
.toggle input{width:auto}
.seg{padding:8px 10px;border-radius:10px;margin-bottom:2px}
.seg:hover{background:var(--panel)}
.seg.playing{background:var(--accent-soft)}
.seg.other{opacity:.82}
.seg-head{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.seg-head .who{border:0;background:transparent;padding:0;font-size:13px;font-weight:700;color:var(--muted)}
.seg.teacher .who{color:var(--teacher)}
.seg-head .mini{padding:0 6px;font-size:12px;visibility:hidden}
.seg:hover .mini{visibility:visible}
.seg-text{padding-left:32px;white-space:pre-wrap}
.seg-text.nolabel{padding-left:0}
.seg-text[contenteditable]{outline:1px dashed var(--line);border-radius:6px}
mark{color:inherit;border-radius:3px}
mark.hl{background:var(--hl);cursor:pointer}
mark.kw{background:var(--kw)}
.bm{display:inline-flex;gap:4px;align-items:center;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);cursor:pointer}
.rpanel{position:sticky;top:76px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px 14px;height:calc(100vh - 180px);display:flex;flex-direction:column}
.rpanel .tabs{margin:0 0 10px}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column}
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
.chat-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 10px}
.tabbody-chat .chat-log{max-height:none;min-height:200px}
.msg{padding:9px 12px;border-radius:12px;max-width:92%}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg ul{margin:4px 0;padding-left:18px}.msg p{margin:2px 0}.msg h3{font-size:14px;margin:6px 0 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{font-size:13px;border-radius:99px;padding:4px 10px}
.chat-input{display:flex;gap:6px;align-items:flex-end}
.chat-input textarea{resize:none;border-radius:12px}
.chat-input button{white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.photos img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:pointer;display:block}
.marks-list .bm{margin:3px 4px 3px 0;font-size:13px;padding:3px 10px}
.summary h3{font-size:15px;margin:14px 0 6px}.summary ul{margin:4px 0;padding-left:20px}.summary p{margin:4px 0}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
details.menu{position:relative}
details.menu summary{list-style:none;cursor:pointer;padding:6px 12px;border-radius:8px;color:var(--muted)}
details.menu summary::-webkit-details-marker{display:none}
details.menu summary:hover{background:var(--accent-soft)}
.menu-pop{position:absolute;right:0;top:36px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:200px;display:flex;flex-direction:column}
.menu-pop button{border:0;text-align:left;background:transparent}
.menu-pop button:hover{background:var(--accent-soft)}

/* 底部播放列 */
.player{position:fixed;left:240px;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 24px calc(10px + env(safe-area-inset-bottom))}
.player .pbtn{border:0;background:transparent;font-size:15px;padding:6px 8px}
.player .play{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px}
.player .ptime{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.player input[type=range]{flex:1;padding:0;border:0;accent-color:var(--accent);background:transparent}
#hlBtn{position:fixed;z-index:40;transform:translateX(-50%);box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--text);color:var(--bg);border:0;border-radius:99px;padding:6px 14px}

/* 錄音中 */
.rec-wrap{max-width:560px;margin:30px auto;text-align:center}
.rec-dot{width:16px;height:16px;border-radius:50%;background:var(--rec);display:inline-block;animation:pulse 1.2s ease-in-out infinite;vertical-align:middle;margin-right:8px}
.rec-dot.paused{animation:none;background:var(--muted)}
@keyframes pulse{50%{opacity:.25}}
.big-time{font-size:56px;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:1px;margin:8px 0}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter>div{height:100%;width:0;background:var(--accent);transition:width .08s}
.rec-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.rec-btns button{padding:10px 16px;border-radius:99px}

@media (max-width:1099px){.sess-layout{grid-template-columns:minmax(0,1fr)}.rpanel{display:none}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside#aside{position:fixed;left:0;top:0;z-index:50;width:270px;transform:translateX(-105%);transition:transform .2s}
  aside#aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  #scrim.on{display:block;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.3)}
  .menu-btn{display:inline-block}
  .topbar{padding:10px 12px}
  .topbar .lbl{display:none}
  main{padding:14px 16px 120px}
  .player{left:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:4px}
  .player .ptime{font-size:12px}
  .big-time{font-size:44px}
  .seg-text{padding-left:0}
}
</style>
</head>
<body>
<div class="app">
<aside id="aside">
  <div class="brand" onclick="UI.showFolder('all')"><span style="font-size:22px">🎙️</span><h1>課堂錄音</h1></div>
  <button class="rec" style="margin:0 4px 10px;padding:9px" onclick="UI.showRecorder()">● 開始錄音</button>
  <div id="folderList"></div>
  <div class="side-foot">
    <div class="nav hidden" id="acctNav" onclick="UI.showAccount()"></div>
    <a class="nav" href="guide/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">📖 使用說明</a>
    <div class="nav" onclick="UI.showSettings()">⚙️ 設定</div>
    <p class="muted" id="storageInfo" style="padding:0 10px"></p>
  </div>
</aside>
<div id="scrim" onclick="UI.closeDrawer()"></div>
<div class="mainwrap">
  <header class="topbar">
    <button class="menu-btn ghost" onclick="UI.openDrawer()" aria-label="選單">☰</button>
    <input id="q" class="search grow" type="search" placeholder="🔍 搜尋標題、逐字稿、筆記" oninput="UI.search(this.value)">
    <button onclick="UI.importFile()" title="匯入音檔">⬆<span class="lbl"> 匯入</span></button>
    <button class="rec" onclick="UI.showRecorder()">●<span class="lbl"> 錄音</span></button>
  </header>
  <main id="main"></main>
</div>
</div>
<button id="hlBtn" class="hidden" onmousedown="event.preventDefault()" onclick="UI.addHL()">🖍 畫重點</button>
<input type="file" id="fileInput" accept="audio/*,video/*,.m4a,.mp3,.wav,.webm" class="hidden">
<input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="sampleInput" accept="audio/*,.m4a" class="hidden">

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/dist/umd/supabase.js"></script>
<script>
// ===================== 資料庫（IndexedDB，全部存在這台裝置上） =====================
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('class-recorder', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('folders', { keyPath: 'id' });
        const s = d.createObjectStore('sessions', { keyPath: 'id' });
        s.createIndex('folderId', 'folderId');
        const c = d.createObjectStore('chunks', { autoIncrement: true });
        c.createIndex('sessionId', 'sessionId');
        const p = d.createObjectStore('photos', { keyPath: 'id' });
        p.createIndex('sessionId', 'sessionId');
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && 'result' in out ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  },
  // 分類和錄音改了就記下時間，登入時同步到雲端
  put(store, v) { if (SYNCED[store]) { v.updatedAt = Date.now(); Cloud.mark(store, v.id); } return this.tx(store, 'readwrite', s => s.put(v)); },
  putRaw(store, v) { return this.tx(store, 'readwrite', s => s.put(v)); },
  get(store, k) { return this.tx(store, 'readonly', s => s.get(k)); },
  del(store, k) { if (SYNCED[store]) Cloud.markDeleted(store, k); return this.tx(store, 'readwrite', s => s.delete(k)); },
  delRaw(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  byIndex(store, idx, v) { return this.tx(store, 'readonly', s => s.index(idx).getAll(v)); },
  async delByIndex(store, idx, v) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, 'readwrite');
      const req = t.objectStore(store).index(idx).openKeyCursor(IDBKeyRange.only(v));
      req.onsuccess = () => { const c = req.result; if (c) { t.objectStore(store).delete(c.primaryKey); c.continue(); } };
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  },
};
const SYNCED = { folders: 'folder', sessions: 'session' };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const KIND = { course: '課程', meeting: '會議', project: '專案' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = sec => { sec = Math.max(0, Math.floor(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const fmtDate = ts => new Date(ts).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });

// ===================== 設定（存在這個瀏覽器的 localStorage） =====================
const Settings = {
  defaults: { engine: 'gemini', geminiKey: '', geminiModel: 'gemini-3.8-flash', openaiKey: '', whisperBase: 'https://api.groq.com/openai/v1', whisperKey: '', whisperModel: 'whisper-large-v3-turbo', localUrl: 'http://127.0.0.1:8080', language: '', toTraditional: true, chunkMin: 10, summaryProvider: 'gemini', summaryModel: '', anthropicKey: '', noiseSuppression: false, chatProvider: 'groq', chatModel: '', geminiTextKey: '', aiMode: 'cloud', syncAudio: false },
  load() {
    try {
      const raw = JSON.parse(localStorage.getItem('cr-settings') || 'null'), v = { ...this.defaults, ...(raw || {}) };
      // 之前已經自己填過 key 的人，維持用自己的 key
      if (raw && !raw.aiMode) v.aiMode = raw.geminiKey || raw.whisperKey || raw.openaiKey || raw.anthropicKey ? 'own' : 'cloud';
      return v;
    } catch { return { ...this.defaults }; }
  },
  save(v) { try { localStorage.setItem('cr-settings', JSON.stringify(v)); } catch {} },
};
let S = Settings.load();

// ===================== 簡轉繁（OpenCC，台灣用詞） =====================
let _cc = null;
async function toTW(text) {
  if (!S.toTraditional || !text) return text;
  try {
    if (!_cc) {
      if (!window.OpenCC) await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
      _cc = OpenCC.Converter({ from: 'cn', to: 'twp' });
    }
    return _cc(text);
  } catch { return text; }
}

// ===================== 錄音 =====================
const Rec = {
  state: 'idle', // idle | recording | paused
  async start({ source, folderId, title }) {
    const ctx = new AudioContext();
    await ctx.resume();
    const dest = ctx.createMediaStreamDestination();
    const analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    analyser.connect(dest); // 聲音走 來源 → analyser → 錄音，音量條才讀得到
    const streams = [];
    if (source === 'mic' || source === 'both') {
      const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: !!S.noiseSuppression, autoGainControl: true } });
      streams.push(mic);
    }
    if (source === 'system' || source === 'both') {
      if (!navigator.mediaDevices.getDisplayMedia) throw new Error('這個瀏覽器不能錄電腦聲音。請用電腦版 Chrome 或 Edge。手機無法錄內建聲音。');
      const disp = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, systemAudio: 'include', selfBrowserSurface: 'exclude' });

function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);

  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) { const x = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }

}
async function decode16k(blob) {

}

// 在每一段裡，講最多話的人推定為老師；有老師聲音樣本時以樣本為準
function markTeacher(segs, hasSample) {
  if (hasSample) { segs.forEach(s => s.role = s.label === '老師' ? 'teacher' : (s.label ? 'other' : null)); return; }
  const dur = {};
  segs.forEach(s => { if (s.label) dur[s.label] = (dur[s.label] || 0) + (s.end - s.start); });
  const top = Object.entries(dur).sort((a, b) => b[1] - a[1])[0]?.[0];
  segs.forEach(s => s.role = !s.label ? null : (s.label === top ? 'teacher' : 'other'));
}

// 同一個人連續講的話併成一段，但每段最多約 180 字或 90 秒，換人或停頓超過 3 秒就分段
function mergeSegments(segs) {
  const out = [];
  for (const g of segs) {
    const p = out[out.length - 1];
    if (p && p.label === g.label && p.role === g.role && g.start - p.end < 3 && (p.text + g.text).length <= 180 && g.end - p.start <= 90) {
      p.text += (/[A-Za-z0-9]$/.test(p.text) && /^[A-Za-z0-9]/.test(g.text) ? ' ' : '') + g.text;
      p.end = Math.max(p.end, g.end);
    } else out.push({ ...g });
  }
  return out;
}

async function transcribeSession(id, onProgress) {
  const s = await DB.get('sessions', id);
  const folder = s.folderId ? await DB.get('folders', s.folderId) : null;
  onProgress('解碼音檔中…');
  const audio = await sessionAudio(id);
  if (!audio.size) throw new Error(s.audioCloud ? '音檔還沒從雲端下載下來，請重新打開這段錄音再試。' : '這台裝置上沒有這段錄音的音檔（可能是在別的裝置錄的）。');
  const pcm = await decode16k(audio);
  const engine = effEngine();
  // Gemini 一次最多送 20 MB，所以每段最多 5 分鐘；雲端每段 3 分鐘，上傳比較快
  const per = Math.max(1, engine === 'cloud' ? 2 : engine === 'gemini' ? Math.min(5, S.chunkMin) : S.chunkMin) * 60 * 16000;
  const total = Math.ceil(pcm.length / per);
  const out = [];
  for (let i = 0; i < total; i++) {
    onProgress(`轉寫中 ${i + 1} / ${total} 段…`);
    const offset = i * per / 16000;
    const wav = encodeWav(pcm.subarray(i * per, Math.min(pcm.length, (i + 1) * per)), 16000);
    const segs = await Engines[engine](wav, folder);
    markTeacher(segs, !!folder?.teacherSample);
    for (const g of segs) out.push({ start: g.start + offset, end: g.end + offset, text: await toTW((g.text || '').trim()), role: g.role || null, label: g.label ? `${i + 1}-${g.label}` : null });
  }
  s.transcript = { engine, createdAt: Date.now(), segments: mergeSegments(out.filter(x => x.text)), merged: true };
  if (!s.duration) s.duration = pcm.length / 16000;
  await DB.put('sessions', s);
  return s;
}

const obj = props => ({ type: 'OBJECT', properties: props, required: Object.keys(props) });
const NOTES_SCHEMA = obj({
  overview: STR,
  keywords: arr(STR),
  actionItems: arr(obj({ text: STR, start: NUM })),
  outline: arr(obj({ start: NUM, title: STR, bullets: arr(STR) })),
  glossary: arr(obj({ term: STR, meaning: STR })),
  unclear: arr(obj({ text: STR, start: NUM })),
  questions: arr(obj({ q: STR, a: STR })),
});
const NOTES_SHAPE = '{"overview":"...","keywords":["..."],"actionItems":[{"text":"...","start":123}],"outline":[{"start":0,"title":"...","bullets":["..."]}],"glossary":[{"term":"...","meaning":"..."}],"unclear":[{"text":"...","start":456}],"questions":[{"q":"...","a":"..."}]}';

// Groq 免費方案每分鐘只收約 8000 token：太長的逐字稿平均抽樣到放得下
async function notesTranscript(s, forceSmall) {
  const full = transcriptText(s, { sec: true });
  const groq = forceSmall || effSummary() === 'groq' || (effSummary() === 'cloud' && (await Cloud.getStatus()).notes === 'groq');
  if (!groq || full.length <= 5000) return full;
  const lines = full.split('\n'), k = Math.ceil(full.length / 5000);
  return '（逐字稿太長，以下是平均抽出的片段）\n' + lines.filter((_, i) => i % k === 0).join('\n');
}
async function makeNotes(s) {
  const bms = s.bookmarks.map(b => `[${fmt(b.t)}] ${b.label}`).join('\n') || '（無）';
  const build = tr => `你是幫大學生整理上課筆記的助教。下面是一段錄音的逐字稿，每行開頭是 [時間|秒數] 說話者：內容（可能有辨識錯字，請依上下文理解）。
請用台灣繁體中文整理成 JSON。規則：不要開場白或問候；不要用 LaTeX 或 $ 符號，數學式寫成一般文字（例如 p < 0.05、α）；用台灣慣用詞（例如迴歸、變異數）；英文術語保留原文。所有 start 欄位填那句話開頭「|」後面的秒數，對不到就填 -1。
- overview：3 到 5 句的概述，說這段在講什麼、結論是什麼
- keywords：5 到 10 個關鍵字，必須是逐字稿裡原樣出現過的詞
- actionItems：老師交代的作業、考試範圍、繳交期限、要準備的事；沒有就給空陣列
- outline：依時間順序分成 3 到 8 個段落，每段一個短標題和 2 到 4 個重點
- glossary：出現的專有名詞與一句話解釋
- unclear：講得很快、有人發問或可能沒聽懂的地方；沒有就給空陣列
- questions：5 題複習問題與簡短答案

使用者在錄音時按下的重點標記：
${bms}

逐字稿：
${tr}`;
  const small = effSummary() === 'cloud' ? build(await notesTranscript(s, true)) : undefined;
  const n = parseJSON(await toTW(await callLLM(build(await notesTranscript(s)), { schema: NOTES_SCHEMA, shape: NOTES_SHAPE, model: S.summaryModel, small })));
  const list = x => Array.isArray(x) ? x : [];
  const t = x => Number.isFinite(+x) ? +x : -1;
  return {
    createdAt: Date.now(),
    overview: String(n.overview || ''),
    keywords: [...new Set(list(n.keywords).map(String).map(k => k.trim()).filter(Boolean))],
    actionItems: list(n.actionItems).map(a => ({ text: String(a.text || ''), start: t(a.start), done: false })).filter(a => a.text),
    outline: list(n.outline).map(o => ({ start: t(o.start), title: String(o.title || ''), bullets: list(o.bullets).map(String) })),
    glossary: list(n.glossary).map(g => ({ term: String(g.term || ''), meaning: String(g.meaning || '') })),
    unclear: list(n.unclear).map(u => ({ text: String(u.text || ''), start: t(u.start) })),
    questions: list(n.questions).map(q => ({ q: String(q.q || ''), a: String(q.a || '') })),
  };
}

// Groq 免費方案每分鐘只收約 8000 token，整堂課放不下，所以只挑跟問題最相關的段落，再附上 AI 筆記的大綱
function relevantText(s, q, budget) {
  const segs = s.transcript?.segments || [];
  const line = g => { const n = spkName(s, spkKey(g)); return `[${fmt(g.start)}] ${n ? n + '：' : ''}${g.text}`; };
  if (segs.reduce((n, g) => n + g.text.length + 12, 0) <= budget) return segs.map(line).join('\n');
  const grams = t => { const x = t.toLowerCase().replace(/\s+/g, ''), set = new Set(x.match(/[a-z0-9][a-z0-9.\-]+/g) || []); for (let i = 0; i < x.length - 1; i++) set.add(x.slice(i, i + 2)); return set; };
  const qg = grams(q);
  const score = segs.map((g, i) => { const sg = grams(g.text); let n = 0; for (const w of qg) if (sg.has(w)) n += w.length > 2 ? 3 : 1; return { i, v: n / Math.sqrt(1 + g.text.length / 40) + (g.role === 'teacher' ? 0.01 : 0) }; }).sort((a, b) => b.v - a.v);
  const pick = new Set(); let used = 0;
  for (const { i, v } of score) {
    if (v <= 0 && pick.size) break;
    for (const j of [i, i - 1, i + 1]) { const g = segs[j]; if (!g || pick.has(j)) continue; if (used + g.text.length > budget) continue; pick.add(j); used += g.text.length + 12; }
    if (used > budget * 0.9) break;
  }
  return [...pick].sort((a, b) => a - b).map(j => line(segs[j])).join('\n');
}
async function askAI(s, q) {
  const p = effChat();
  const small = p === 'groq' || (p === 'cloud' && (await Cloud.getStatus()).chat === 'groq');
  const hist = (s.chat || []).slice(small ? -2 : -6).map(m => (m.role === 'user' ? '問：' : '答：') + (small ? m.text.slice(0, 300) : m.text)).join('\n');
  const n = s.notes;
  const notes = small && n ? `AI 筆記：\n${n.overview}\n${n.outline.map(o => `[${o.start >= 0 ? fmt(o.start) : '?'}] ${o.title}：${o.bullets.join('；')}`).join('\n')}\n${n.actionItems.length ? '待辦：' + n.actionItems.map(a => a.text).join('；') : ''}\n` : '';
  const prompt = `你是這段錄音的助理。只根據下面的內容回答，用台灣繁體中文，簡短、能條列就條列。引用內容時在句尾標註時間，格式 [12:34]，照每行開頭的時間。內容裡沒提到的，就說「錄音裡沒有提到」，不要自己編。不要開場白，不要用 LaTeX 或 $ 符號。
${small ? '\n' + notes + '\n逐字稿（只節錄和問題相關的段落）：' : '\n逐字稿：'}
${small ? relevantText(s, q + ' ' + (s.chat || []).slice(-2).map(m => m.text).join(' '), 3000) : transcriptText(s)}
${hist ? '\n之前的對話：\n' + hist + '\n' : ''}
問題：${q}`;
  return (await toTW(await callLLM(prompt, { provider: p, model: S.chatModel, kind: 'chat' }))).trim();
}
// 簡易 Markdown 顯示（標題、條列、粗體）
function mdToHtml(md) {
  // 模型偶爾還是會吐 LaTeX，轉成一般文字
  const tex = t => t.replace(/\\text\{([^}]*)\}/g, '$1').replace(/\\(le|leq)\b/g, '≤').replace(/\\(ge|geq)\b/g, '≥').replace(/\\neq?\b/g, '≠').replace(/\\alpha\b/g, 'α').replace(/\\beta\b/g, 'β').replace(/\\mu\b/g, 'μ').replace(/\\sigma\b/g, 'σ').replace(/\\times\b/g, '×').replace(/\$/g, '');
  let html = '', depth = 0;
  const close = to => { while (depth > to) { html += '</ul>'; depth--; } };
  for (const raw of String(md || '').split('\n')) {
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(raw)) continue;
    const line = esc(tex(raw)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const li = line.match(/^(\s*)(?:[-*+]|\d+\.)\s+(.*)/);
    if (li) {
      const want = li[1].replace(/\t/g, '  ').length >= 2 ? 2 : 1;
      while (depth < want) { html += '<ul>'; depth++; }
      close(want);
      html += `<li>${li[2]}</li>`; continue;
    }
    close(0);
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) html += `<h3>${h[2]}</h3>`; else if (line.trim()) html += `<p>${line}</p>`;
  }
  close(0);
  return html;
}

function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
const tsMd = t => t >= 0 ? ` [${fmt(t)}]` : '';
function notesToMd(n) {
  let md = '';
  if (n.overview) md += '## 概述\n\n' + n.overview + '\n\n';
  if (n.keywords.length) md += '關鍵字：' + n.keywords.join('、') + '\n\n';
  if (n.actionItems.length) md += '## 待辦事項\n\n' + n.actionItems.map(a => `- [${a.done ? 'x' : ' '}] ${a.text}${tsMd(a.start)}`).join('\n') + '\n\n';
  if (n.outline.length) md += '## 大綱\n\n' + n.outline.map(o => `### ${o.title}${tsMd(o.start)}\n\n` + o.bullets.map(b => '- ' + b).join('\n')).join('\n\n') + '\n\n';
  if (n.glossary.length) md += '## 名詞解釋\n\n' + n.glossary.map(g => `- **${g.term}**：${g.meaning}`).join('\n') + '\n\n';
  if (n.unclear.length) md += '## 可能還沒懂的地方\n\n' + n.unclear.map(u => `- ${u.text}${tsMd(u.start)}`).join('\n') + '\n\n';
  if (n.questions.length) md += '## 複習問題\n\n' + n.questions.map((q, i) => `${i + 1}. ${q.q}\n   - ${q.a}`).join('\n') + '\n\n';
  return md;
}
function toMarkdown(s, folder) {
  let md = `# ${s.title}\n\n- 分類：${folder ? KIND[folder.kind] + '／' + folder.name : '未分類'}\n- 時間：${new Date(s.createdAt).toLocaleString('zh-TW')}\n- 長度：${fmt(s.duration)}\n\n`;
  if (s.notes) md += notesToMd(s.notes); else if (s.summary) md += s.summary + '\n\n';
  const hls = (s.transcript?.segments || []).flatMap(g => (g.hl || []).map(([a, b]) => `- [${fmt(g.start)}] ${g.text.slice(a, b)}`));
  if (hls.length) md += '## 我畫的重點\n\n' + hls.join('\n') + '\n\n';
  if (s.bookmarks.length) md += '## 我的標記\n\n' + s.bookmarks.map(b => `- [${fmt(b.t)}] ${b.label}`).join('\n') + '\n\n';
  if (s.transcript) md += '## 逐字稿\n\n' + transcriptText(s).split('\n').join('\n\n') + '\n';
  return md;
}
function toSrt(s) {
  const t = x => { const ms = Math.round(x * 1000); const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), sec = Math.floor(ms % 60000 / 1000); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')},${String(ms % 1000).padStart(3, '0')}`; };
  return (s.transcript?.segments || []).map((g, i) => `${i + 1}\n${t(g.start)} --> ${t(g.end || g.start + 3)}\n${g.text}\n`).join('\n');
}

// ===================== 雲端：登入、免 key 的 AI、跨裝置同步（Supabase） =====================
// 分類和錄音的文字（逐字稿、筆記、問答、重點）會同步；音檔要按「上傳音檔」或在設定打開自動上傳；照片不同步
const Cloud = {
  sb: null, user: null, status: null, queue: new Map(), _t: null, syncing: null, lastSync: 0,
  cfg() { let o = {}; try { o = JSON.parse(localStorage.getItem('cr-cloud') || '{}'); } catch {} return { ...(window.RECORDER_CONFIG || {}), ...o }; },
  async init() {
    const c = this.cfg();
    if (!c.supabaseUrl || !c.supabaseKey || !window.supabase) return;
    this.sb = window.supabase.createClient(c.supabaseUrl, c.supabaseKey, { db: { schema: 'recorder' } });
    const { data } = await this.sb.auth.getSession();
    this.user = data.session?.user || null;
    this.sb.auth.onAuthStateChange((ev, session) => {
      const was = this.user?.id; this.user = session?.user || null;
      if (this.user?.id !== was) { this.status = null; if (this.user) this.sync(); UI.refreshSidebar(); }
    });
    if (this.user) this.sync();
  },
  async token() { return (await this.sb.auth.getSession()).data.session?.access_token || ''; },
  async call(body) {
    if (!this.sb) throw new Error('雲端還沒設定好，請到設定改用自己的 API key。');
    if (!this.user) throw new Error('請先登入（左下角「🔑 登入」），或到設定改用自己的 API key。');
    const c = this.cfg();
    const r = await post(`${c.supabaseUrl}/functions/v1/recorder-ai`, { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + await this.token(), apikey: c.supabaseKey }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `雲端錯誤 ${r.status}`);
    return j;
  },
  async getStatus(force) { if (!this.status || force) this.status = await this.call({ task: 'status' }); return this.status; },

  // ---- 同步 ----
  mark(store, id) { if (!this.user) return; this.queue.set(store + ':' + id, { store, id }); clearTimeout(this._t); this._t = setTimeout(() => this.push(), 1500); },
  markDeleted(store, id) { if (!this.user) return; this.queue.set(store + ':' + id, { store, id, deleted: true }); clearTimeout(this._t); this._t = setTimeout(() => this.push(), 500); },
  async toRow(store, v) {
    const data = { ...v };
    delete data.owner;
    if (store === 'folders' && v.teacherSample instanceof Blob) { data.teacherSample = null; data.teacherSampleB64 = await blobToDataURL(v.teacherSample); }
    return { owner: this.user.id, kind: SYNCED[store], id: v.id, data, updated_at: v.updatedAt || Date.now(), deleted: false };
  },
  async fromRow(store, row) {
    const v = { ...row.data, updatedAt: row.updated_at, owner: row.owner };
    if (store === 'folders' && v.teacherSampleB64) { v.teacherSample = await (await fetch(v.teacherSampleB64)).blob(); delete v.teacherSampleB64; }
    if (store === 'sessions') v.bookmarks ||= [];
    return v;
  },
  async push() {
    if (!this.user || !this.queue.size) return;
    const items = [...this.queue.values()]; this.queue.clear();
    const rows = [];
    for (const it of items) {
      if (it.deleted) { rows.push({ owner: this.user.id, kind: SYNCED[it.store], id: it.id, data: {}, updated_at: Date.now(), deleted: true }); continue; }
      const v = await DB.get(it.store, it.id);
      if (!v || (v.owner && v.owner !== this.user.id)) continue; // 這台裝置上別人的資料不要傳
      if (!v.owner) { v.owner = this.user.id; await DB.putRaw(it.store, v); }
      rows.push(await this.toRow(it.store, v));
    }
    if (!rows.length) return;
    const { error } = await this.sb.from('items').upsert(rows, { onConflict: 'owner,kind,id' });
    if (error) { items.forEach(it => this.queue.set(it.store + ':' + it.id, it)); console.warn('同步失敗', error.message); return; }
    this.lastSync = Date.now();
  },
  async pull() {
    const key = 'cr-pull-' + this.user.id, since = +(localStorage.getItem(key) || 0);
    let max = since, changed = false;
    for (let from = 0; ; from += 500) {
      const { data, error } = await this.sb.from('items').select('*').gt('updated_at', since).order('updated_at').range(from, from + 499);
      if (error) throw error;
      for (const row of data) {
        const store = row.kind === 'folder' ? 'folders' : 'sessions', local = await DB.get(store, row.id);
        max = Math.max(max, row.updated_at);
        if (row.deleted) {
          if (local) { changed = true; await DB.delRaw(store, row.id); if (store === 'sessions') { await DB.delByIndex('chunks', 'sessionId', row.id); await DB.delByIndex('photos', 'sessionId', row.id); } }
        } else if (!local || (local.updatedAt || 0) < row.updated_at) { changed = true; await DB.putRaw(store, await this.fromRow(store, row)); }
      }
      if (data.length < 500) break;
    }
    localStorage.setItem(key, String(max));
    return changed;
  },
  // 登入後：先拉雲端的，再把這台裝置上還沒傳過（或登出時改過）的推上去
  sync() {
    if (!this.user) return Promise.resolve();
    return this.syncing ||= (async () => {
      try {
        const changed = await this.pull();
        const pk = 'cr-push-' + this.user.id, since = +(localStorage.getItem(pk) || 0);
        for (const store of Object.keys(SYNCED)) for (const v of await DB.all(store)) if ((!v.owner || (v.owner === this.user.id && (v.updatedAt || 0) > since))) this.queue.set(store + ':' + v.id, { store, id: v.id });
        await this.push();
        localStorage.setItem(pk, String(Date.now()));
        this.lastSync = Date.now();
        if (changed && ['list', 'session'].includes(UI.view) && !UI.isBusy?.()) UI.view === 'list' ? UI.showFolder(UI.current.folderId) : UI.refreshSidebar();
      } catch (e) { console.warn('同步失敗', e); }
      finally { this.syncing = null; }
    })();
  },

  // ---- 音檔 ----
  audioPath(id) { return `${this.user.id}/${id}`; },
  async uploadAudio(s) {
    if (!this.user) throw new Error('請先登入');
    const blob = await sessionAudio(s.id);
    if (!blob.size) throw new Error('這台裝置上沒有這段錄音的音檔');
    const { error } = await this.sb.storage.from('recorder-audio').upload(this.audioPath(s.id), blob, { upsert: true, contentType: blob.type || 'audio/webm' });
    if (error) throw new Error(/exceed|size|quota/i.test(error.message) ? '雲端空間不夠或檔案太大（單檔上限 50 MB）。' : error.message);
    const cur = await DB.get('sessions', s.id); cur.audioCloud = true; await DB.put('sessions', cur);
    return cur;
  },
  async downloadAudio(s) {
    const { data, error } = await this.sb.storage.from('recorder-audio').download(this.audioPath(s.id));
    if (error || !data) return false;
    await DB.putRaw('chunks', { sessionId: s.id, idx: 0, blob: data.type ? data : new Blob([data], { type: (s.mimeType || 'audio/webm').split(';')[0] }) });
    return true;
  },
  async removeAudio(id) { try { await this.sb.storage.from('recorder-audio').remove([this.audioPath(id)]); } catch {} },
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Cloud.user && Date.now() - Cloud.lastSync > 30000) Cloud.sync(); });

// 把畫重點和關鍵字標成 <mark>，文字本身不變，選取範圍的字數位置才對得上
function richText(text, hl = [], kw = '') {
  const n = text.length, H = new Int16Array(n).fill(-1), K = new Uint8Array(n);
  hl.forEach(([a, b], i) => { for (let j = Math.max(0, a); j < Math.min(n, b); j++) H[j] = i; });
  if (kw) { const lt = text.toLowerCase(), lk = kw.toLowerCase(); for (let i = lt.indexOf(lk); i >= 0; i = lt.indexOf(lk, i + lk.length)) K.fill(1, i, i + lk.length); }
  let out = '';
  for (let i = 0; i < n;) {
    let j = i; while (j < n && H[j] === H[i] && K[j] === K[i]) j++;
    let t = esc(text.slice(i, j));
    if (K[i]) t = `<mark class="kw">${t}</mark>`;
    if (H[i] >= 0) t = `<mark class="hl" title="點一下取消重點" data-h="${H[i]}">${t}</mark>`;
    out += t; i = j;
  }
  return out;
}
const dayLabel = ts => {

  },
  drawMarks() { const el = $('marks'); if (el) el.innerHTML = Rec.session.bookmarks.map(b => `<span class="bm" style="margin:2px">★ ${fmt(b.t)} ${esc(b.label)}</span>`).join(''); },

  importFile() {

  // ---------- 單一錄音：左邊摘要／逐字稿，右邊 AI 問答，底下播放列 ----------
  teacherOnly: false, hlOnly: false, editing: false, kw: '', busy: null, busyMsg: '', err: '',
  async showSession(id) {
    this.leave('session'); await this.refreshSidebar();
    const s = await DB.get('sessions', id); if (!s) return this.showFolder('all');
    if (s.transcript && !s.transcript.merged) { s.transcript.segments = mergeSegments(s.transcript.segments); s.transcript.merged = true; await DB.put('sessions', s); }
    if (this.sid !== id) { this.tab = s.transcript && !s.notes && !s.summary ? 'transcript' : 'summary'; this.rtab = 'chat'; this.kw = ''; this.editing = false; this.hlOnly = false; this.err = ''; }
    this.sid = id; this.s = s;
    this.photos = (await DB.byIndex('photos', 'sessionId', id)).sort((a, b) => a.t - b.t);
    let audio = await sessionAudio(id);
    if (!audio.size && s.audioCloud && Cloud.user) { main.innerHTML = '<div class="empty"><div class="spinner"></div><p>從雲端下載音檔…</p></div>'; if (await Cloud.downloadAudio(s)) audio = await sessionAudio(id); }
    this.noAudio = !audio.size;
    const audioUrl = URL.createObjectURL(audio);
    main.innerHTML = `<div class="sess-layout">
      <div>
        <div class="row"><button class="ghost" onclick="UI.showFolder(UI.current.folderId)">← 返回</button><span class="grow"></span>
          <details class="menu"><summary>⤓ 匯出</summary><div class="menu-pop">

          <button class="ghost danger" onclick="UI.deleteSession()">刪除</button></div>
        <input id="sTitle" class="title-input" value="${esc(s.title)}" onchange="UI.patch({title:this.value})">
        <div class="row"><span class="muted">${fmtDate(s.createdAt)} · <span id="sDur">${fmt(s.duration)}</span></span><select class="folder-sel" onchange="UI.patch({folderId:this.value||null})">${await this.folderOptions(s.folderId)}</select></div>
        ${this.noAudio ? `<p class="note" style="margin-top:10px">這台裝置上沒有這段錄音的音檔${s.audioCloud ? '，雲端下載失敗，等一下重新打開試試' : '（在別的裝置錄的）。要在這裡聽，請到原本的裝置按「匯出 → 上傳音檔」'}。逐字稿和筆記照樣可以看。</p>` : ''}
        <div id="sHead"></div>

        <div id="tabBody"></div>
      </div>

      <button class="pbtn play" id="playBtn" title="播放／暫停（空白鍵）" onclick="UI.togglePlay()">▶</button>
      <button class="pbtn" title="快轉 5 秒（→）" onclick="UI.skip(5)">5 ↻</button>
      <span class="ptime" id="pTime">0:00 / ${fmt(s.duration)}</span>
      <input type="range" id="pRange" min="0" max="1000" value="0" oninput="UI.scrub(this.value)">
      <button class="pbtn" id="pRate" title="播放速度" onclick="UI.cycleRate()">${this.rate || 1}×</button>
    </div>`;
    const player = $('player');
    player.playbackRate = this.rate || 1;
    // MediaRecorder 錄出的 webm 沒有長度資訊，先跳到最後讓瀏覽器算出長度
    player.addEventListener('loadedmetadata', () => { if (player.duration === Infinity) { player.currentTime = 1e101; player.addEventListener('timeupdate', function f() { player.removeEventListener('timeupdate', f); player.currentTime = 0; }); } });
    player.addEventListener('timeupdate', () => this.onTime());

  dur() { const p = $('player'); return p && isFinite(p.duration) && p.duration > 0 ? p.duration : this.s?.duration || 0; },
  onTime() {

  },
  togglePlay() { const p = $('player'); if (!p) return; p.paused ? p.play() : p.pause(); },
  skip(d) { const p = $('player'); if (p) p.currentTime = Math.max(0, Math.min(this.dur(), p.currentTime + d)); },
  scrub(v) { const p = $('player'); if (p) p.currentTime = v / 1000 * this.dur(); },
  cycleRate() { const r = [1, 1.25, 1.5, 2, 0.75]; this.rate = r[(r.indexOf(this.rate || 1) + 1) % r.length]; $('player').playbackRate = this.rate; $('pRate').textContent = this.rate + '×'; },
  seek(t) { const p = $('player'); if (!p) return; p.currentTime = t; p.play(); },

  paint() { this.paintHead(); this.paintTabs(); this.paintTab(); this.paintRight(); },
  paintHead() {
    const s = this.s, segs = s.transcript?.segments || [];
    const stats = {}; let total = 0;
    for (const g of segs) { const k = spkKey(g); if (!k) continue; const n = spkName(s, k), d = Math.max(0.5, g.end - g.start); (stats[n] ||= { d: 0, teacher: false }).d += d; if (g.role === 'teacher') stats[n].teacher = true; total += d; }
    this._spk = Object.entries(stats).sort((a, b) => b[1].d - a[1].d);
    const spk = this._spk.length ? `<div class="speakers">${this._spk.map(([n, v], i) => `<button class="spk" title="點一下改名" onclick="UI.renameSpk(${i})"><span class="av" style="background:${v.teacher ? 'var(--teacher)' : colorFor(n)}">${esc(initial(n))}</span>${esc(n)} <span class="muted">${Math.round(v.d / total * 100)}%</span></button>`).join('')}</div>` : '';
    const kws = s.notes?.keywords || [];
    const kw = kws.length ? `<div class="kws"><span class="muted">關鍵字</span>${kws.map((k, i) => `<button class="chip ${this.kw === k ? 'on' : ''}" onclick="UI.toggleKw(${i})">${esc(k)}</button>`).join('')}</div>` : '';
    $('sHead').innerHTML = spk + kw;

  tabsList() {
    const t = [['summary', '摘要'], ['transcript', '逐字稿']];
    if (!WIDE.matches) t.push(['chat', '💬 AI 問答'], ['marks', '標記與照片']);

  },
  paintTabs() {
    if (!this.tabsList().some(([k]) => k === this.tab)) this.tab = 'summary';
    $('tabs').innerHTML = this.tabsList().map(([k, n]) => `<button class="${this.tab === k ? 'on' : ''}" onclick="UI.setTab('${k}')">${n}</button>`).join('');
  },
  setTab(k) { this.tab = k; this.hideHL(); this.paintTabs(); this.paintTab(); },
  paintTab() {
    const b = $('tabBody'); if (!b) return;
    b.className = this.tab === 'chat' ? 'tabbody-chat' : '';
    b.innerHTML = this.tab === 'summary' ? this.renderSummary() : this.tab === 'transcript' ? this.renderTranscript() : this.tab === 'chat' ? this.renderChat() : this.renderMarks();
    if (this.tab === 'chat') this.scrollChat();
    this.onTime();
  },
  paintRight() {
    const r = $('rpanel'); if (!r) return;
    if (!WIDE.matches) { r.innerHTML = ''; return; }
    r.innerHTML = `<div class="tabs">${[['chat', '💬 AI 問答'], ['marks', `標記與照片${this.s.bookmarks.length + this.photos.length ? ' ' + (this.s.bookmarks.length + this.photos.length) : ''}`]].map(([k, n]) => `<button class="${this.rtab === k ? 'on' : ''}" onclick="UI.rtab='${k}';UI.paintRight()">${n}</button>`).join('')}</div>
      <div class="rbody">${this.rtab === 'chat' ? this.renderChat() : `<div style="overflow:auto">${this.renderMarks()}</div>`}</div>`;
    if (this.rtab === 'chat') this.scrollChat();
  },
  repaintChat() { if (WIDE.matches) this.paintRight(); else if (this.tab === 'chat') this.paintTab(); },
  isBusy() { return this.busy && this.busyId === this.s?.id; },
  needBox() { return useCloud() ? `<p class="muted">${needWhat()}</p><button class="primary" onclick="UI.showAccount()">🔑 登入</button>` : `<p class="muted">${needWhat()}</p><button onclick="UI.showSettings()">⚙️ 去設定</button>`; },
  busyBox() { return `<div class="empty"><div class="spinner"></div><p id="busyMsg">${esc(this.busyMsg || '處理中…')}</p></div>`; },
  errBox() { return this.err ? `<p class="err">${esc(this.err)}</p>` : ''; },

  // ----- 摘要分頁 -----
  renderSummary() {
    const s = this.s, n = s.notes;
    if (this.isBusy()) return this.busyBox();
    if (!s.transcript) return `${this.errBox()}<div class="empty"><div class="big">📝</div><p>這段錄音還沒有逐字稿。</p>${useCloud() && !Cloud.user ? this.needBox() : `<button class="primary" onclick="UI.doTranscribe()">開始轉寫</button><p class="muted">轉寫完會自動產生 AI 筆記。${useCloud() ? '用免費雲端轉寫，每天有額度上限。' : '引擎可在設定裡換。'}</p>`}</div>`;
    if (!n) return `${this.errBox()}${s.summary ? `<div class="ncard"><div class="row"><h3 class="grow" style="margin:0">AI 整理重點（舊版）</h3><button onclick="UI.speak()">🔊 朗讀</button><button class="primary" onclick="UI.doNotes()">產生新版筆記</button></div><div class="summary">${mdToHtml(s.summary)}</div></div>`
      : `<div class="empty"><div class="big">✨</div><p>還沒有 AI 筆記。</p><button class="primary" ${llmKey() ? '' : 'disabled'} onclick="UI.doNotes()">產生 AI 筆記</button>${llmKey() ? '' : this.needBox()}</div>`}`;
    const todo = n.actionItems.map((a, i) => `<label class="todo ${a.done ? 'done' : ''}"><input type="checkbox" ${a.done ? 'checked' : ''} onchange="UI.todo(${i},this.checked)"><span>${esc(a.text)} ${tsLink(a.start)}</span><button class="ghost x" title="刪除" onclick="event.preventDefault();UI.delTodo(${i})">✕</button></label>`).join('');
    return `${this.errBox()}
      <div class="ncard"><h3>概述<span class="grow"></span><button class="ghost" onclick="UI.speak()">🔊 朗讀</button><button class="ghost" onclick="UI.doNotes()">↻ 重新整理</button></h3><p>${esc(n.overview)}</p></div>
      <div class="ncard"><h3>☑️ 待辦事項</h3>${todo || '<p class="muted">沒有提到作業或期限。</p>'}
        <input id="todoIn" placeholder="＋ 新增待辦，按 Enter" style="margin-top:8px" onkeydown="if(event.key==='Enter'&&!event.isComposing)UI.addTodo(this.value)"></div>
      ${n.outline.length ? `<div class="ncard"><h3>🧭 大綱</h3>${n.outline.map(o => `<div class="ol">${tsLink(o.start)}<b>${esc(o.title)}</b><ul>${o.bullets.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}
      ${n.glossary.length ? `<div class="ncard"><h3>📖 名詞解釋</h3><ul>${n.glossary.map(g => `<li><b>${esc(g.term)}</b>：${esc(g.meaning)}</li>`).join('')}</ul></div>` : ''}
      ${n.unclear.length ? `<div class="ncard"><h3>🤔 可能還沒懂的地方</h3><ul>${n.unclear.map(u => `<li>${esc(u.text)} ${tsLink(u.start)}</li>`).join('')}</ul></div>` : ''}
      ${n.questions.length ? `<div class="ncard"><h3>📝 複習問題</h3>${n.questions.map((q, i) => `<details class="qa"><summary>${i + 1}. ${esc(q.q)}</summary><div>${esc(q.a)}</div></details>`).join('')}</div>` : ''}`;
  },
  async todo(i, done) { this.s.notes.actionItems[i].done = done; await this.save(); this.paintTab(); },
  async delTodo(i) { this.s.notes.actionItems.splice(i, 1); await this.save(); this.paintTab(); },
  async addTodo(text) { text = text.trim(); if (!text) return; this.s.notes.actionItems.push({ text, start: -1, done: false }); await this.save(); this.paintTab(); $('todoIn')?.focus(); },

  // ----- 逐字稿分頁 -----
  renderTranscript() {
    const s = this.s, segs = s.transcript?.segments || [];
    if (this.isBusy()) return this.busyBox();
    if (!segs.length) return `${this.errBox()}<div class="empty"><div class="big">📝</div><p>還沒有逐字稿。</p><button class="primary" onclick="UI.doTranscribe()">開始轉寫</button></div>`;
    const hasRoles = segs.some(g => g.role), hasHL = segs.some(g => g.hl?.length);
    if (!hasHL) this.hlOnly = false;
    const rows = segs.map((g, i) => {
      if ((this.teacherOnly && g.role === 'other') || (this.hlOnly && !g.hl?.length)) return '';
      const name = spkName(s, spkKey(g));
      const bms = s.bookmarks.filter(b => b.t >= g.start && b.t < g.end).map(b => `<span class="bm" title="錄音時的標記">★ ${esc(b.label)}</span>`).join('');
      return `<div class="seg ${g.role || ''}" data-s="${g.start}" data-e="${g.end}">
        <div class="seg-head">${name ? `<span class="av" style="background:${g.role === 'teacher' ? 'var(--teacher)' : colorFor(name)}">${esc(initial(name))}</span><button class="who" title="點一下改名" onclick="UI.renameSeg(${i})">${esc(name)}</button>` : ''}${tsLink(g.start)}${bms}${g.role ? `<button class="ghost mini" title="切換這個人是不是老師" onclick="UI.flipRole(${i})">${g.role === 'teacher' ? '不是老師' : '設成老師'}</button>` : ''}</div>
        <div class="seg-text ${name ? '' : 'nolabel'}" data-i="${i}" ${this.editing ? `contenteditable="true" onblur="UI.editSeg(${i},this.innerText)">${esc(g.text)}` : `>${richText(g.text, g.hl, this.kw)}`}</div></div>`;
    }).join('');
    return `${this.errBox()}<div class="toolbar">
      ${hasRoles ? `<label class="toggle"><input type="checkbox" ${this.teacherOnly ? 'checked' : ''} onchange="UI.teacherOnly=this.checked;UI.paintTab()">只看老師</label>` : ''}
      ${hasHL ? `<label class="toggle"><input type="checkbox" ${this.hlOnly ? 'checked' : ''} onchange="UI.hlOnly=this.checked;UI.paintTab()">只看重點</label>` : ''}
      <label class="toggle"><input type="checkbox" ${this.editing ? 'checked' : ''} onchange="UI.editing=this.checked;UI.paintTab()">編輯文字</label>
      ${this.kw ? `<button class="chip on" onclick="UI.kw='';UI.paintHead();UI.paintTab()">「${esc(this.kw)}」${segs.filter(g => g.text.toLowerCase().includes(this.kw.toLowerCase())).length} 段 ✕</button>` : ''}
      <span class="grow"></span><button onclick="UI.doTranscribe()">重新轉寫</button></div>
      <p class="muted" style="margin-top:0">${this.editing ? '直接點文字修改，離開那一段就會存檔。改過的段落，重點會被清掉。' : '用滑鼠或手指選取文字可以畫重點，點黃色的地方取消。點名字可以改名。'}</p>
      <div id="segs">${rows || '<p class="muted">沒有符合的段落。</p>'}</div>`;
  },
  async editSeg(i, text) { const g = this.s.transcript.segments[i]; if (g.text !== text) { g.text = text; g.hl = []; await this.save(); } },
  async flipRole(i) {
    const segs = this.s.transcript.segments, label = segs[i].label, cur = segs[i].role;
    segs.forEach(g => { if (g.label === label) g.role = cur === 'teacher' ? 'other' : 'teacher'; });
    await this.save(); this.paintHead(); this.paintTab();
  },
  renameSpk(i) { this.rename(this._spk[i][0]); },
  renameSeg(i) { this.rename(spkName(this.s, spkKey(this.s.transcript.segments[i]))); },
  async rename(old) {
    const n = prompt('這位說話者叫什麼名字？', old)?.trim();
    if (!n || n === old) return;
    const s = this.s; s.speakerNames ||= {};
    for (const g of s.transcript.segments) { const k = spkKey(g); if (k && spkName(s, k) === old) s.speakerNames[k] = n; }
    await this.save(); this.paintHead(); this.paintTab();
  },
  toggleKw(i) {
    const k = this.s.notes.keywords[i];
    this.kw = this.kw === k ? '' : k;
    if (this.kw) { this.tab = 'transcript'; this.hlOnly = false; }
    this.paintHead(); this.paintTabs(); this.paintTab();
    document.querySelector('#segs mark.kw')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  },

  // 選取逐字稿文字時，在旁邊出現「畫重點」按鈕
  checkSel() {
    const sel = getSelection();
    if (this.view !== 'session' || this.editing || !sel.rangeCount || sel.isCollapsed) return this.hideHL();
    const r = sel.getRangeAt(0), elOf = n => n.nodeType === 1 ? n : n.parentElement;
    const el = elOf(r.startContainer)?.closest('.seg-text');
    if (!el || el !== elOf(r.endContainer)?.closest('.seg-text')) return this.hideHL();
    const off = (node, o) => { const x = document.createRange(); x.selectNodeContents(el); x.setEnd(node, o); return x.toString().length; };
    const a = off(r.startContainer, r.startOffset), b = off(r.endContainer, r.endOffset);
    if (b - a < 1) return this.hideHL();
    this._sel = { i: +el.dataset.i, a, b };
    const rect = r.getBoundingClientRect(), btn = $('hlBtn');
    btn.style.left = Math.min(innerWidth - 70, Math.max(70, rect.left + rect.width / 2)) + 'px';
    btn.style.top = (rect.top > 60 ? rect.top - 44 : rect.bottom + 8) + 'px';
    btn.classList.remove('hidden');
  },
  hideHL() { $('hlBtn')?.classList.add('hidden'); },
  async addHL() {
    if (!this._sel) return;
    const { i, a, b } = this._sel, g = this.s.transcript.segments[i];
    const list = [...(g.hl || []), [a, b]].sort((x, y) => x[0] - y[0]), m = [];
    for (const r of list) { const l = m[m.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else m.push([...r]); }
    g.hl = m; this._sel = null;
    getSelection().removeAllRanges(); this.hideHL();
    await this.save(); this.paintTab();
  },
  async removeHL(i, h) {
    const g = this.s.transcript.segments[i]; g.hl.splice(h, 1);
    await this.save(); this.paintTab();
  },

  // ----- AI 問答 -----
  renderChat() {
    const s = this.s;
    if (!s.transcript) return `<div class="empty"><p>轉寫完就可以問這段錄音任何問題。</p></div>`;
    const chat = s.chat || [];
    const cp = effChat();
    if (!keyFor(cp)) return `<div class="empty">${cp === 'cloud' ? this.needBox() : `<p>AI 問答要先到設定填入${cp === 'groq' ? ' Groq（免費）' : ''} API key。</p><button onclick="UI.showSettings()">⚙️ 去設定</button>`}</div>`;
    const msgs = chat.map(m => m.role === 'user' ? `<div class="msg user">${esc(m.text)}</div>` : `<div class="msg ai">${this.linkTimes(mdToHtml(m.text))}</div>`).join('');
    const sugg = ['老師說哪些會考？', '幫我列出作業和期限', '用三句話解釋今天的重點', '有哪些地方我可能沒聽懂？'];
    return `<div class="chat"><div class="chat-log" id="chatLog">
        ${msgs || `<div class="muted" style="padding:6px 2px">問這段錄音任何問題，AI 只根據逐字稿回答，並附上時間，點時間可以跳去聽。</div>`}
        ${this.asking === s.id ? '<div class="msg ai muted">思考中…</div>' : ''}</div>
      ${chat.length ? '' : `<div class="chips">${sugg.map(q => `<button onclick="UI.ask('${q}')">${q}</button>`).join('')}</div>`}
      <p id="chatErr" class="err">${esc(this.chatErr || '')}</p>
      <div class="chat-input"><textarea id="chatIn" rows="2" placeholder="問這段錄音…（Enter 送出）" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();UI.ask()}"></textarea><button class="primary" ${this.asking ? 'disabled' : ''} onclick="UI.ask()">送出</button></div>
      ${chat.length ? `<div style="text-align:right"><button class="ghost" style="font-size:12px" onclick="UI.clearChat()">清除對話</button></div>` : ''}</div>`;
  },
  linkTimes(html) { return html.replace(/\[(\d{1,2}(?::\d{2}){1,2})\]/g, (m, t) => `<a class="ts" onclick="UI.seek(${t.split(':').reduce((a, x) => a * 60 + +x, 0)})">${t}</a>`); },
  scrollChat() { const l = $('chatLog'); if (l) l.scrollTop = l.scrollHeight; if (!WIDE.matches && this.tab === 'chat' && this.asking) l?.lastElementChild?.scrollIntoView({ block: 'nearest' }); },
  async ask(q) {
    const s = this.s, inp = $('chatIn');
    q = (q ?? inp?.value ?? '').trim();
    if (!q || this.asking) return;
    s.chat ||= []; s.chat.push({ role: 'user', text: q });
    this.asking = s.id; this.chatErr = ''; this.repaintChat();
    try { s.chat.push({ role: 'ai', text: await askAI(s, q) }); }
    catch (e) { s.chat.pop(); this.chatErr = '回答失敗：' + e.message; }
    this.asking = null;
    await DB.put('sessions', s);
    if (this.s === s) { this.repaintChat(); if (this.chatErr) $('chatIn').value = q; }
  },
  async clearChat() { if (!confirm('清除這段錄音的問答紀錄？')) return; this.s.chat = []; await this.save(); this.repaintChat(); },

  // ----- 標記與照片 -----
  renderMarks() {
    const s = this.s;
    if (!s.bookmarks.length && !this.photos.length) return `<div class="empty"><p>錄音時按「★ 標記重點」或「📷 拍白板」，會出現在這裡。</p></div>`;
    return `${s.bookmarks.length ? `<h3>★ 錄音時的標記</h3><div class="marks-list">${s.bookmarks.map(b => `<span class="bm" onclick="UI.seek(${b.t})">★ ${fmt(b.t)} ${esc(b.label)}</span>`).join('')}</div>` : ''}
      ${this.photos.length ? `<h3 style="margin-top:14px">📷 照片</h3><div class="photos">${this.photos.map(p => `<div><img src="${URL.createObjectURL(p.blob)}" onclick="UI.seek(${p.t})"><div class="muted">${fmt(p.t)}</div></div>`).join('')}</div>` : ''}`;
  },

  // ----- 轉寫與 AI 筆記 -----
  async doTranscribe() {
    const id = this.s.id;
    this.busy = 'transcribe'; this.busyId = id; this.busyMsg = '準備中…'; this.err = ''; this.paint();
    try {
      const s = await transcribeSession(id, t => { this.busyMsg = t; const el = $('busyMsg'); if (el) el.textContent = t; });
      this.busy = null;
      if (this.sid === id) this.s = s;
      if (llmKey()) { if (this.sid === id) this.tab = 'summary'; await this.doNotes(s); }
      else if (this.sid === id) { this.tab = 'transcript'; this.paint(); }
    } catch (e) { this.busy = null; this.err = '轉寫失敗：' + e.message; if (this.sid === id) this.paint(); }
  },
  async doNotes(s = this.s) {
    this.busy = 'notes'; this.busyId = s.id; this.busyMsg = 'AI 正在整理筆記…'; this.err = '';
    if (this.s === s) this.paint();
    try { s.notes = await makeNotes(s); await DB.put('sessions', s); }
    catch (e) { this.err = '整理筆記失敗：' + e.message; }
    this.busy = null;
    if (this.s === s) this.paint();
  },
  speak() {
    const n = this.s.notes;
    const text = n ? [n.overview, ...n.outline.map(o => o.title + '。' + o.bullets.join('。'))].join('\n') : document.querySelector('.summary')?.innerText || '';
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[#*]/g, ''));
    u.lang = 'zh-TW'; u.voice = speechSynthesis.getVoices().find(v => v.lang === 'zh-TW') || null; speechSynthesis.speak(u);
  },
  async uploadAudio() {
    const btn = event?.target; if (btn) { btn.disabled = true; btn.textContent = '上傳中…'; }
    try { this.s = await Cloud.uploadAudio(this.s); alert('已上傳。用同一個帳號在別的裝置打開這段錄音，就能聽。'); }
    catch (e) { alert('上傳失敗：' + e.message); }
    if (btn) btn.disabled = false;
    this.showSession(this.s.id);
  },
  async deleteSession() { const id = this.s.id; if (!confirm('確定刪除這段錄音與逐字稿？無法復原。' + (Cloud.user ? '其他裝置上的也會一起刪掉。' : ''))) return; if (this.s.audioCloud && Cloud.user) Cloud.removeAudio(id); await DB.delByIndex('chunks', 'sessionId', id); await DB.delByIndex('photos', 'sessionId', id); await DB.del('sessions', id); this.showFolder(this.current.folderId); },
  async mdNow() { const s = this.s; return toMarkdown(s, s.folderId && await DB.get('folders', s.folderId)); },
  async exportMd() { download(this.s.title + '.md', new Blob([await this.mdNow()], { type: 'text/markdown' })); },
  async copyMd() { await navigator.clipboard.writeText(await this.mdNow()); alert('已複製，可以直接貼到 Notion。'); },
  async exportSrt() { if (!this.s.transcript) return alert('還沒有逐字稿。'); download(this.s.title + '.srt', new Blob([toSrt(this.s)], { type: 'text/plain' })); },
  async exportAudio() { const b = await sessionAudio(this.s.id); download(this.s.title + (b.type.includes('mp4') ? '.m4a' : b.type.includes('wav') ? '.wav' : '.webm'), b); },

  // ---------- 帳號 ----------
  async showAccount(mode) {
    this.leave('account'); await this.refreshSidebar();
    if (!Cloud.sb) return this.showSettings();
    if (!Cloud.user) {
      const signup = mode === 'signup';
      main.innerHTML = `<div class="narrow" style="max-width:460px"><div class="card"><h2>${signup ? '建立帳號' : '登入'}</h2>
        <p class="muted">登入後不用申請任何 API key，轉寫、AI 筆記和問答都能直接用（每天有免費額度）。逐字稿和筆記會同步，換手機或電腦登入同一個帳號就看得到。</p>
        ${signup ? '<label>名字</label><input id="aName" autocomplete="name" placeholder="例如：小明">' : ''}
        <label>Email</label><input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com">
        <label>密碼（至少 6 個字）</label><input id="aPw" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" onkeydown="if(event.key==='Enter')UI.auth('${signup ? 'signup' : 'login'}')">
        <div class="row" style="margin-top:14px"><button class="primary" onclick="UI.auth('${signup ? 'signup' : 'login'}')">${signup ? '建立帳號' : '登入'}</button>
          <button class="ghost" onclick="UI.showAccount('${signup ? 'login' : 'signup'}')">${signup ? '已經有帳號？登入' : '還沒有帳號？建立一個'}</button></div>
        <p id="aMsg" class="err"></p>

      $('aEmail').focus();

    }
    const u = Cloud.user;
    main.innerHTML = `<div class="narrow" style="max-width:560px"><div class="card"><h2>👤 ${esc(u.user_metadata?.name || u.email.split('@')[0])}</h2>
      <p class="muted">${esc(u.email)}</p>
      <h3 style="margin-top:16px">今天的免費額度</h3><div id="quota" class="muted">讀取中…</div>
      <h3 style="margin-top:16px">同步</h3>
      <p class="muted">分類、逐字稿、AI 筆記、問答、畫的重點會自動同步到這個帳號。音檔要在錄音頁按「匯出 → 上傳音檔」，或在設定打開「錄完自動上傳音檔」。照片不同步。</p>
      <div class="row"><button onclick="UI.syncNow()">↻ 立即同步</button><span id="syncMsg" class="muted">${Cloud.lastSync ? '上次同步：' + new Date(Cloud.lastSync).toLocaleTimeString('zh-TW') : ''}</span></div>
      <div class="row" style="margin-top:20px"><button class="danger" onclick="UI.signOut()">登出</button></div></div></div>`;
    try {
      const st = await Cloud.getStatus(true);
      $('quota').innerHTML = `轉寫：已用 ${st.used.audioMin} ／ ${st.limits.audioMin} 分鐘<br>AI 筆記與問答：已用 ${st.used.calls} ／ ${st.limits.calls} 次<br>${st.speakers ? '轉寫分得出老師和學生。' : '目前雲端轉寫不分講者（管理員還沒設定 Gemini）。'}`;
    } catch (e) { $('quota').textContent = '讀不到：' + e.message; }
  },
  async auth(mode) {
    const email = $('aEmail').value.trim(), pw = $('aPw').value, msg = $('aMsg');
    if (!email || pw.length < 6) { msg.textContent = '請填 Email 和至少 6 個字的密碼。'; return; }
    msg.textContent = '';
    const r = mode === 'signup'
      ? await Cloud.sb.auth.signUp({ email, password: pw, options: { data: { name: $('aName').value.trim() } } })
      : await Cloud.sb.auth.signInWithPassword({ email, password: pw });
    if (r.error) { msg.textContent = /Invalid login/i.test(r.error.message) ? 'Email 或密碼不對。' : /registered/i.test(r.error.message) ? '這個 Email 已經註冊過，請直接登入。' : r.error.message; return; }
    if (mode === 'signup' && !r.data.session) { msg.textContent = '已寄出確認信，到信箱點連結後再回來登入。'; return; }
    Cloud.user = r.data.user; Cloud.status = null;
    await Cloud.sync();
    this.showFolder('all');
  },
  async syncNow() { $('syncMsg').textContent = '同步中…'; await Cloud.sync(); $('syncMsg').textContent = '上次同步：' + new Date(Cloud.lastSync).toLocaleTimeString('zh-TW'); this.refreshSidebar(); },
  async signOut() {
    if (!confirm('登出？這台裝置上的錄音會留著，下次登入會繼續同步。')) return;
    await Cloud.push(); await Cloud.sb.auth.signOut(); Cloud.user = null; Cloud.status = null; this.showFolder('all');
  },

  // ---------- 設定 ----------
  async showSettings() {
    this.leave('settings'); await this.refreshSidebar();
    const opt = (v, t, cur) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${t}</option>`;
    main.innerHTML = `<div class="narrow"><div class="card"><h2>設定</h2>
      ${Cloud.sb ? `<h3 style="margin-top:4px">AI 怎麼用</h3>
      <label class="toggle" style="margin-top:8px"><input type="radio" name="aiMode" value="cloud" ${S.aiMode === 'cloud' ? 'checked' : ''} onchange="UI.setMode(this.value)"><span><b>免費雲端</b>（建議）：登入就能用，不用申請 key，每天有額度上限</span></label>
      <label class="toggle" style="margin-top:8px"><input type="radio" name="aiMode" value="own" ${S.aiMode === 'own' ? 'checked' : ''} onchange="UI.setMode(this.value)"><span><b>用我自己的 API key</b>（進階）：沒有額度限制，可以選引擎和模型</span></label>
      ${S.aiMode === 'cloud' && !Cloud.user ? '<p class="muted">還沒登入。<a href="#" onclick="UI.showAccount();return false">登入或建立帳號</a></p>' : ''}
      ${Cloud.user ? `<label class="toggle" style="margin-top:12px"><input type="checkbox" id="syncAudio" ${S.syncAudio ? 'checked' : ''}>錄完自動上傳音檔到雲端（換裝置也能聽；免費空間大家共用約 1 GB，一小時約 15 MB）</label>` : ''}
      <details id="ownKeys" ${S.aiMode === 'own' ? 'open' : ''} style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">自己的 API key 與進階設定</summary>` : '<details open>'}
      <p class="note" style="margin-top:10px">API key 只存在這個瀏覽器裡，直接送到你選的服務，不會經過任何其他伺服器。不要在別人的電腦上填。</p>
      <h3 style="margin-top:16px">轉寫引擎</h3>
      <select id="engine">${opt('gemini', 'Google Gemini（免費額度，分得出老師與學生）', S.engine)}${opt('whisper-api', 'Groq Whisper（免費額度，每天約 8 小時，不分說話者）', S.engine)}${opt('whispercpp', '我 Mac 上的 whisper.cpp（完全免費、不上網，不分說話者）', S.engine)}${opt('openai-diarize', 'OpenAI（付費約 US$0.36／小時，分得出老師與學生）', S.engine)}</select>
      <label>Gemini API key（轉寫、AI 筆記、問答共用，到 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> 免費申請）</label><input id="geminiKey" type="password" value="${esc(S.geminiKey)}" placeholder="AIza...">
      <p class="muted">免費方案的錄音會被 Google 拿去改進模型。不想這樣就選 Groq 或 Mac 本機。</p>
      <label>Gemini 模型</label><input id="geminiModel" value="${esc(S.geminiModel)}">
      <label>OpenAI API key</label><input id="openaiKey" type="password" value="${esc(S.openaiKey)}" placeholder="sk-...">
      <label>Whisper 服務網址</label><input id="whisperBase" value="${esc(S.whisperBase)}">
      <label>Groq API key（到 <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> 免費申請，gsk_ 開頭）</label><input id="whisperKey" type="password" value="${esc(S.whisperKey)}">
      <label>Whisper 模型</label><input id="whisperModel" value="${esc(S.whisperModel)}">
      <label>本機 whisper-server 網址</label><input id="localUrl" value="${esc(S.localUrl)}">
      <label>語言</label><select id="language">${opt('', '自動（中英夾雜選這個）', S.language)}${opt('zh', '中文', S.language)}${opt('en', '英文', S.language)}</select>
      <label>每次送出的長度（分鐘）</label><input id="chunkMin" type="number" min="1" max="20" value="${S.chunkMin}">
      <label class="toggle" style="margin-top:10px"><input type="checkbox" id="toTraditional" ${S.toTraditional ? 'checked' : ''}>把簡體字轉成台灣繁體（OpenCC）</label>
      <label class="toggle" style="margin-top:6px"><input type="checkbox" id="noiseSuppression" ${S.noiseSuppression ? 'checked' : ''}>錄音時開啟降噪（教室吵時試試；老師離很遠時可能反而聽不清楚）</label>
      <h3 style="margin-top:20px">AI 筆記與問答</h3>
      <label>AI 筆記用</label>
      <select id="summaryProvider">${opt('gemini', 'Google Gemini', S.summaryProvider)}${opt('openai', 'OpenAI（付費）', S.summaryProvider)}${opt('anthropic', 'Anthropic Claude（付費）', S.summaryProvider)}</select>
      <label>AI 筆記的模型名稱（空白＝用預設）</label><input id="summaryModel" value="${esc(S.summaryModel)}">
      <label>AI 問答用</label>
      <select id="chatProvider">${opt('groq', 'Groq 免費（和轉寫共用 Groq key，只挑相關段落給 AI）', S.chatProvider)}${opt('gemini', 'Google Gemini（看整份逐字稿）', S.chatProvider)}${opt('openai', 'OpenAI（付費）', S.chatProvider)}${opt('anthropic', 'Anthropic Claude（付費）', S.chatProvider)}</select>
      <label>AI 問答的模型名稱（空白＝用預設；Groq 預設 openai/gpt-oss-120b）</label><input id="chatModel" value="${esc(S.chatModel)}">
      <label>筆記與問答專用的 Gemini key（選填）</label><input id="geminiTextKey" type="password" value="${esc(S.geminiTextKey)}" placeholder="留空就用上面那把">
      <p class="muted">上面那把 key 如果綁了帳單會花錢。用另一個 Google 帳號、沒綁帳單的專案申請一把填在這裡，筆記和問答就走免費額度（免費額度的內容會被 Google 拿去改進模型）。</p>
      <label>Anthropic API key</label><input id="anthropicKey" type="password" value="${esc(S.anthropicKey)}">
      </details>
      <div class="row" style="margin-top:16px"><button class="primary" onclick="UI.saveSettings()">儲存</button><span id="setMsg" class="muted"></span></div>
      <h3 style="margin-top:20px">快捷鍵</h3>
      <p class="muted">錄音時：空白鍵＝標記重點。聽錄音時：空白鍵＝播放／暫停，← →＝倒退／快轉 5 秒。</p></div></div>`;
  },
  setMode(v) { S.aiMode = v; Settings.save(S); this.showSettings(); },
  saveSettings() {
    const g = id => $(id);
    S = { ...S, engine: g('engine').value, geminiKey: g('geminiKey').value.trim(), geminiModel: g('geminiModel').value.trim() || Settings.defaults.geminiModel, openaiKey: g('openaiKey').value.trim(), whisperBase: g('whisperBase').value.trim(), whisperKey: g('whisperKey').value.trim(), whisperModel: g('whisperModel').value.trim(), localUrl: g('localUrl').value.trim(), language: g('language').value, chunkMin: Math.min(20, Math.max(1, +g('chunkMin').value || 10)), toTraditional: g('toTraditional').checked, noiseSuppression: g('noiseSuppression').checked, summaryProvider: g('summaryProvider').value, summaryModel: g('summaryModel').value.trim(), chatProvider: g('chatProvider').value, chatModel: g('chatModel').value.trim(), geminiTextKey: g('geminiTextKey').value.trim(), anthropicKey: g('anthropicKey').value.trim(), syncAudio: g('syncAudio') ? g('syncAudio').checked : S.syncAudio };
    Settings.save(S); g('setMsg').textContent = '已儲存';
  },
};

// 點黃色重點取消（只在沒有選取文字時）
main.addEventListener('click', e => {
  const m = e.target.closest('mark.hl'); if (!m || UI.editing || !getSelection().isCollapsed) return;
  UI.removeHL(+m.closest('.seg-text').dataset.i, +m.dataset.h);
});
let _selT; document.addEventListener('selectionchange', () => { clearTimeout(_selT); _selT = setTimeout(() => UI.checkSel(), 120); });
window.addEventListener('scroll', () => UI.hideHL(), { passive: true });
document.addEventListener('click', e => { document.querySelectorAll('details.menu[open]').forEach(d => { if (!d.contains(e.target) || e.target.closest('.menu-pop button')) d.open = false; }); });
WIDE.addEventListener('change', () => { if (UI.view === 'session' && UI.s) { UI.paintTabs(); UI.paintTab(); UI.paintRight(); } });
document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) || a.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
  if (Rec.state !== 'idle') { if (e.code === 'Space' && UI.view === 'rec') { e.preventDefault(); UI.mark(); } return; }
  if (UI.view !== 'session') return;
  if (e.code === 'Space') { e.preventDefault(); a.blur?.(); UI.togglePlay(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); UI.skip(-5); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); UI.skip(5); }
});

(async () => {
  await DB.open();
  try { await navigator.storage?.persist?.(); } catch {}
  try { await Cloud.init(); } catch (e) { console.warn('雲端初始化失敗', e); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  UI.showFolder('all');
})();
</script>
</body>
</html>
