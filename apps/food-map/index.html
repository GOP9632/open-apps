<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>美食收藏</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#f76707">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--bg:#faf8f5;--panel:#fff;--text:#1f1b16;--muted:#7a7166;--line:#ece6de;--accent:#f76707;--accent-soft:#fff1e6;--accent-text:#c24f00;--ok:#2b8a3e;--ok-soft:#ebfbee;--danger:#e03131;--like:#e64980;--shadow:0 6px 24px rgba(60,40,20,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--panel:#1e1b18;--text:#f1ece6;--muted:#a59b90;--line:#332e29;--accent:#ff8a3d;--accent-soft:#3a2516;--accent-text:#ffa866;--ok:#69db7c;--ok-soft:#183020;--danger:#ff6b6b;--like:#f06595;--shadow:0 6px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
/* iPhone 會把小於 16px 的輸入框自動放大，而且不會縮回來 */
select,input,textarea{font-size:16px}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--danger)}
button.big{padding:12px 20px;font-size:17px;border-radius:14px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
a{color:var(--accent-text)}
h1{font-size:20px;margin:0}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hidden{display:none!important}
.err{color:var(--danger);font-size:13px;white-space:pre-wrap}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}

/* 版面 */
header.top{position:sticky;top:0;z-index:500;background:var(--bg);padding:12px 16px 8px;padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:30px;height:30px}
main{padding:0 16px 120px;max-width:1100px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:600;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px max(6px,env(safe-area-inset-bottom))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;color:var(--muted);padding:4px 10px;min-width:56px}
nav.tabs button .i{font-size:22px;line-height:28px}
nav.tabs button.on{color:var(--accent-text);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:650;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:30px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
@media (min-width:900px){
  nav.tabs{top:0;bottom:auto;left:auto;right:16px;border:0;background:transparent;padding-top:max(10px,env(safe-area-inset-top));gap:4px}
  nav.tabs button{flex-direction:row;gap:6px;font-size:14px;border-radius:10px;padding:6px 12px}
  nav.tabs button .i{font-size:18px}
  nav.tabs button.on{background:var(--accent-soft)}
  .fab{bottom:28px;right:28px}
  #who{display:none}
  main{padding-bottom:60px}
}

/* 篩選 */
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
select.chip{width:auto;padding:5px 26px 5px 12px}
.search{border-radius:99px;padding:9px 16px}

/* 店家卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.place{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:box-shadow .15s}
.place:hover{box-shadow:var(--shadow)}
.emo{flex:none;width:46px;height:46px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:24px}
.place .name{font-weight:600;font-size:16px;line-height:1.3}
.meta{color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.been{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.want{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.empty{text-align:center;padding:50px 16px;color:var(--muted)}
.empty .big{font-size:48px}

/* 地圖 */
#map{height:calc(100vh - 210px);min-height:360px;border-radius:16px;border:1px solid var(--line);z-index:1}
@media (min-width:900px){#map{height:calc(100vh - 170px)}}
.pin{font-size:20px;width:36px;height:36px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--panel);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin span{transform:rotate(45deg)}
.pin.been{border-color:var(--ok)}
.pin.other{border-style:dashed}
.leaflet-popup-content{margin:10px 12px;font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.minimap{height:200px;border-radius:12px;border:1px solid var(--line);margin-top:6px}

/* 底部抽屜 / 視窗 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet-h h2{margin:0;flex:1}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--panel);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cand{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.cand.off{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stars span{font-size:22px;cursor:pointer;color:var(--line)}
.stars span.on{color:#fab005}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:2000;font-size:14px;max-width:90vw;text-align:center;box-shadow:var(--shadow)}

/* 抽籤 */
.draw-box{text-align:center;padding:28px 16px;background:var(--panel);border:1px solid var(--line);border-radius:20px;margin:12px 0}
.draw-name{font-size:28px;font-weight:700;min-height:44px;margin:8px 0}
.draw-box .emo{width:76px;height:76px;font-size:42px;border-radius:24px;margin:0 auto}
.rolling .draw-name{color:var(--muted)}
.fgroup{margin:10px 0}
.fgroup .t{font-size:13px;color:var(--muted);margin-bottom:4px}
.fgroup .filters{flex-wrap:wrap;overflow:visible}

/* 滑卡 */
.deck{position:relative;height:440px;max-width:380px;margin:12px auto}
.swipe-card{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;touch-action:none;user-select:none;cursor:grab}
.swipe-card .hero{height:150px;border-radius:18px;background:linear-gradient(135deg,var(--accent-soft),var(--bg));display:flex;align-items:center;justify-content:center;font-size:74px;margin-bottom:14px}
.swipe-card .name{font-size:24px;font-weight:700;line-height:1.25}
.stamp{position:absolute;top:28px;font-size:28px;font-weight:800;padding:2px 12px;border:4px solid;border-radius:10px;opacity:0}
.stamp.like{left:24px;color:var(--like);transform:rotate(-14deg)}
.stamp.nope{right:24px;color:var(--muted);transform:rotate(14deg)}
.swipe-btns{display:flex;justify-content:center;gap:28px}
.swipe-btns button{width:64px;height:64px;border-radius:50%;font-size:28px;box-shadow:var(--shadow)}
.match{background:linear-gradient(135deg,#ffdeeb,#fff1e6);color:#1f1b16}
.avatar{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--panel)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--like)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt=""><h1>美食收藏</h1><span class="grow"></span><span id="who" class="muted"></span></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<button class="fab" id="fab" title="新增店家" onclick="App.openAdd()">＋</button>
<div id="sheet"></div>
<div id="toast" class="hidden"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
