<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>隨手修</title>
<script src="../portal-home.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* 擋掉 iPhone 連點兩下放大（例如連按復原、返回），雙指縮放照常可用 */
html{touch-action:manipulation}
:root{
  --bg:#0e0e10;--panel:#17171a;--panel2:#222227;--line:#2c2c32;--text:#f4f4f5;--muted:#9a9aa3;
  --accent:#ff5c8a;--accent2:#ffb36b;--grad:linear-gradient(135deg,#ff8a6b,#ff5c8a);
  --text2:rgba(255,255,255,.7);--text3:rgba(255,255,255,.35);--line2:rgba(255,255,255,.12);
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
select,input,textarea{font-size:16px}
button{background:none;border:0;padding:0;cursor:pointer}
#app{display:flex;flex-direction:column;height:100dvh;height:100vh;height:100dvh}

/* 上方工具列 */
.top{display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 8px) 12px 8px}
.top .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.ib:disabled,.ib.dim{opacity:.3}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb{height:32px;padding:0 12px;border-radius:16px;background:var(--panel2);color:var(--text);font-size:14px;white-space:nowrap}
.tb:disabled{opacity:.3}.tb.dim{color:var(--muted)}
/* 復原、重做、看原圖照醒圖／Hypic 放在照片下緣，上排只留換照片、全部重設、合併、儲存 */
#hist{position:absolute;left:12px;right:12px;bottom:12px;display:none;justify-content:space-between;pointer-events:none;z-index:6}
#hist.on{display:flex}
#hist.crop{display:none}
#hist .hg{display:flex;gap:8px}
.fb{pointer-events:auto;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:rgba(23,23,26,.72);border:1px solid var(--line2);color:var(--text)}
.fb:disabled{opacity:.35}
.fb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.save{height:36px;padding:0 18px;border-radius:18px;background:var(--grad);color:#fff;font-weight:600}
.save:disabled{opacity:.35}
/* 窄的手機：上排要擠得下 */
@media (max-width:420px){.top{gap:4px;padding-left:8px;padding-right:8px}.top .ib{width:36px}.tb{padding:0 10px}.save{padding:0 14px;white-space:nowrap}}

/* 畫面 */
#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#fbox{position:relative;flex:none;transform-origin:50% 50%;will-change:transform}
#stage.pan{cursor:grab}
#stage.panning{cursor:grabbing}
#zoom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:center;gap:2px;background:rgba(23,23,26,.85);border:1px solid var(--line2);border-radius:10px;padding:2px;z-index:6}
#zoom.on{display:flex}
@media (max-width:899px){#zoom.on:not(.zoomed){display:none}
  /* 面板固定高度（照醒圖）：換分頁時照片不縮放、選項列不跳。以前高度跟著分頁變，iPhone Safari 只搬舊圖層、
     只重畫一部分，選過的分頁看起來還亮著（殘影，評審 2026-10-27 在 iOS 模擬器重現）。內容貼著下面的分頁列 */
  #pbody{height:227px;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
  #pbody::before{content:'';flex:1 0 0}}
#zoom button{height:30px;min-width:30px;padding:0 6px;border-radius:8px;color:var(--text2);font-size:13px;font-variant-numeric:tabular-nums}
#zoom button:hover{background:var(--line2);color:var(--text)}
#zoom #zPct{min-width:52px}
#frame{position:absolute;inset:0;width:100%;height:100%;display:block}
#frame[hidden]{display:none}
#wrap{position:absolute;left:0;top:0;display:none}
#wrap.on{display:block}
#gl{display:block;width:100%;height:100%;background:repeating-conic-gradient(#2a2a2e 0 25%,#1f1f23 0 50%) 0 0/20px 20px}
#pop{position:absolute;inset:0;width:100%;height:100%;display:none}
#wrap.popon #pop{display:block}
.st canvas{width:100%;height:100%;display:block}
.badge{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:4px 10px;border-radius:10px;font-size:13px;display:none}
#wrap.cmp .badge{display:block}

#empty{text-align:center;padding:24px;max-width:340px}
#empty h1{font-size:28px;margin:0 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#empty p{color:var(--muted);margin:0 0 24px;line-height:1.6}
.big{display:block;width:100%;height:52px;border-radius:26px;background:var(--grad);color:#fff;font-weight:600;font-size:17px;margin-bottom:12px}
.big.alt{background:var(--panel2);color:var(--text)}
#empty small{display:block;color:var(--muted);margin-top:14px;line-height:1.6}

/* 文字貼圖 */
#texts{position:absolute;inset:0;pointer-events:none}
.tx{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:move;touch-action:none;padding:2px;border:1.5px dashed transparent;border-radius:6px}
.tx canvas{display:block;pointer-events:none}
.tx.sel{border-color:rgba(255,255,255,.8)}

/* 貼紙 */
#stickers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.st{position:absolute;pointer-events:auto;touch-action:none;cursor:move;display:grid;place-items:center;outline:1.5px dashed transparent;outline-offset:2px;border-radius:4px}
.st svg,.st img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-select:none;user-select:none}
.st{-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.st.erasing{cursor:crosshair}
.st.sel{outline-color:rgba(255,255,255,.85)}
#wrap.lightdrag{cursor:grab}
#bmbox{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none;z-index:5;box-sizing:border-box}
#bmbox.band{border-left:0;border-right:0;background:rgba(255,255,255,.08)}
#bmbox.oval{border-radius:50%}
#ddov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4}
#rsring{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none;z-index:5}
#rsring.idle{opacity:.6;border-style:dashed}
#faceboxes{position:absolute;inset:0;pointer-events:none;z-index:4}
#faceboxes .fbx{position:absolute;border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer}
#faceboxes .fbx.on{border-color:#3ddc84}
#lightdot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #fff;border-radius:50%;background:rgba(255,236,170,.35);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 12px rgba(255,230,150,.8);pointer-events:none;z-index:5}
.it.stk .ic svg{width:38px;height:30px;stroke:none;fill:initial;stroke-width:initial}
.it.stk .ic img{max-width:38px;max-height:34px;display:block}
.it.stk .ic svg *{stroke-linecap:initial}
.it.emo{width:52px}
.it.emo2 .ic{font-size:24px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.it.emo .ic{font-size:26px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* 裁切框 */
#crop{position:absolute;inset:0;display:none;touch-action:none}
#crop.on{display:block}
#crop .shade{position:absolute;background:rgba(0,0,0,.55)}
#crop .box{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
#crop .box::before,#crop .box::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.4) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.4) 0 calc(66.66% + .5px),transparent 0)}
#crop .box::after{background:linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.4) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.4) 0 calc(66.66% + .5px),transparent 0)}
#crop .h{position:absolute;width:28px;height:28px;border:3px solid #fff;margin:-4px}
#crop .h.tl{left:0;top:0;border-right:0;border-bottom:0}
#crop .h.tr{right:0;top:0;border-left:0;border-bottom:0}
#crop .h.bl{left:0;bottom:0;border-right:0;border-top:0}
#crop .h.br{right:0;bottom:0;border-left:0;border-top:0}

/* 下方面板 */
#panel{background:var(--panel);border-radius:18px 18px 0 0;padding:10px 0 calc(var(--safe-b) + 4px)}
#panel.off{display:none}
.srow{display:flex;align-items:center;gap:12px;padding:4px 18px 10px;min-height:44px}
.srow.hide{visibility:hidden}
#pbody:has(#rows:not(:empty)) .srow.hide{display:none}
.srow label{width:44px;color:var(--muted);font-size:13px;flex:none}
.srow output{width:40px;text-align:right;font-variant-numeric:tabular-nums;flex:none;font-size:14px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;margin:0;pointer-events:none}
/* 滑桿的手指交給 ui.js 的 enhanceRanges（整條都能拖）；只能上下捲的清單裡，左右拖給滑桿、上下拖照樣捲 */
.srow{touch-action:none}
.row:has(input[type=range]){touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,#4a4a52 var(--fill-a,0%),#fff var(--fill-a,0%),#fff var(--fill-b,0%),#4a4a52 var(--fill-b,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9.5px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:3px;background:#4a4a52;border-radius:2px}
input[type=range]::-moz-range-progress{height:3px;background:#fff}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}

.items{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 10px;scrollbar-width:none}
.items::-webkit-scrollbar{display:none}
.items[hidden]{display:none}
#cats{padding-bottom:6px}
#cats .it.wide .ic{height:34px;font-size:13px}
.it{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.it .ic{width:46px;height:46px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;position:relative;color:var(--text);font-size:13px}
.it .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.it.on{color:var(--text)}
.it.on .ic{box-shadow:0 0 0 2px var(--accent)}
.it .dot{position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.it.set .dot{display:block}
.it.ft{width:68px}
.it.ft .ic{width:62px;height:62px;border-radius:12px;overflow:hidden;background-size:cover;background-position:center}
.it.wide{width:auto;padding:0 2px}
.it.wide .ic{width:auto;padding:0 16px;border-radius:23px;white-space:nowrap}
.sw{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.25)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}

.tabs{display:flex;gap:4px;padding:2px 12px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:38px;padding:0 13px;border-radius:19px;color:var(--muted);font-size:14px;white-space:nowrap}
.tab.on{color:var(--text);font-weight:600;background:var(--panel2)}

.phead{display:flex;align-items:flex-start;gap:8px;padding-right:12px}
.phead .note{flex:1}
#bTabReset{flex:none;height:26px;padding:0 10px;border-radius:13px;background:var(--panel2);color:var(--text2);font-size:13px;margin-top:-4px}
#bTabReset[hidden]{display:none}
.note{color:var(--muted);font-size:13px;padding:0 18px 8px;min-height:18px}

/* 一個區塊的滑桿全部列出來（電腦版） */
#rows{padding:2px 0 8px}
#rows:empty{display:none}
.row{display:flex;align-items:center;gap:10px;padding:2px 16px;min-height:38px}
.row label{width:64px;flex:none;font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.set label{color:var(--text)}
.row output{width:36px;flex:none;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--text2);cursor:pointer}
.row input[type=range]{height:24px}

/* 滑桿：漸層軌道、拖動時的數值泡泡 */
input[type=range].grad::-webkit-slider-runnable-track{background:var(--trk)}
input[type=range].grad::-moz-range-track{background:var(--trk)}
input[type=range].grad::-moz-range-progress{background:transparent}
#bubble{position:fixed;z-index:20;transform:translate(-50%,-100%);margin-top:-14px;background:#fff;color:#111;font-size:12px;font-weight:600;padding:3px 7px;border-radius:7px;pointer-events:none;display:none;font-variant-numeric:tabular-nums}
#bubble.on{display:block}

/* 主選單（7 組）和每組裡的分段 */
#groups{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding-top:4px;overflow-x:auto;scrollbar-width:none}
#groups::-webkit-scrollbar{display:none}
.g{flex:1 0 auto;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;color:var(--muted);font-size:12px}
.g svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.g.on{color:var(--text)}
.g.on svg{stroke:var(--accent)}
.tab .tdot{display:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:middle}
.tab.set .tdot{display:inline-block}
.tab.out{display:none}
.tabs.single{display:none}
.tab .chev{display:none}

/* 快捷鍵說明 */
#keys{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:30}
#keys.on{display:grid}
#keys .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;width:min(520px,92vw);max-height:84vh;overflow:auto}
#keys h2{font-size:15px;margin:0 0 10px}
#keys dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:13px}
#keys dt{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
#keys dd{margin:0;color:var(--text2)}
.desk{display:none}
.textedit{display:flex;gap:8px;padding:0 12px 10px}
.textedit[hidden]{display:none}
.textedit input{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;color:var(--text)}
.textedit textarea{flex:1;min-height:44px;max-height:96px;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:10px 12px;color:var(--text)}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 190px);transform:translateX(-50%);background:rgba(30,30,34,.95);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:86vw;text-align:center}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:8}
#busy.on{display:grid}
#busy div{background:var(--panel);padding:16px 20px;border-radius:14px}

@media (min-width:900px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .top{grid-column:1/-1}
  #stage{grid-column:1;grid-row:2}
  #panel{grid-column:2;grid-row:2;width:424px;min-height:0;border-radius:18px 0 0 0;display:grid;grid-template-columns:minmax(0,1fr) 64px;padding:0}
  #panel .items{flex-wrap:wrap;overflow:visible}
  .desk{display:grid}
  /* 分段：一個區塊一個標題列，點了展開，內容接在標題下面 */
  #panel .tabs{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:0;padding:6px 0 16px;overflow-y:auto;min-height:0}
  #panel .tabs.single{display:flex}
  #panel .tabs.single > .tab{display:none}
  #panel .tab{display:flex;align-items:center;flex:none;height:44px;padding:0 16px;border-radius:0;font-size:14px;color:var(--text2);background:none;text-align:left;border-bottom:1px solid var(--line2)}
  #panel .tab.on{color:var(--text);background:none;border-bottom-color:transparent}
  #panel .tab .chev{display:block;margin-left:auto;width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .15s}
  #panel .tab.on .chev{transform:rotate(180deg)}
  #panel .tab.out{display:none}
  #pbody{border-bottom:1px solid var(--line2);padding-bottom:6px;display:flex;flex-direction:column}
  #rows{order:10}
  #panel .tabs.single #pbody{border-bottom:0}
  /* 主選單：右邊一條直欄 */
  #groups{grid-column:2;grid-row:1;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-left:1px solid var(--line);padding:8px 0;overflow-y:auto}
  .g{flex:none;min-width:0;padding:8px 0;font-size:12px;position:relative}
  .g.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:1px;background:var(--accent)}
  .g:hover{color:var(--text)}
  .tab:hover{color:var(--text)}
  #srow{padding-top:8px}
}
/* 拼貼、範本（collage.js） */
#empty .two{display:flex;gap:10px}
#empty .two .big{flex:1}
#cg{position:fixed;inset:0;z-index:7;background:var(--bg);display:none;flex-direction:column}
#cg.on{display:flex}
#cgStage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#cgCanvas{display:block;box-shadow:0 6px 28px rgba(0,0,0,.45);touch-action:none}
.cgbtn{height:36px;padding:0 14px;border-radius:18px;background:var(--panel2);color:var(--text);font-weight:600;margin-right:6px}
.cgp{background:var(--panel);border-radius:18px 18px 0 0;padding:10px 0 calc(var(--safe-b) + 4px)}
.it.lo .ic{color:#8a8a93}
.it.lo.on .ic{color:var(--accent)}
.it.lo .ic svg{fill:none}
.it.lo .ic polygon{stroke:none}
.it.tp{width:auto;min-width:64px}
.it.tp .ic{height:74px;border-radius:8px;overflow:hidden;background:#fff}
.it.tp .ic canvas{width:100%;height:100%;display:block}
.it.tp span:last-child{max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.ft .ic canvas{border-radius:12px}
@media (min-width:900px){
  #cg.on{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr)}
  #cg .top{grid-column:1/-1}
  #cgStage{grid-column:1;grid-row:2}
  .cgp{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;border-radius:18px 0 0 0;display:flex;flex-direction:column}
  .cgp .items{flex-wrap:wrap;overflow:visible}
  .cgp .tabs{order:-1;border-top:0;border-bottom:1px solid var(--line);margin-bottom:10px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="ib portal-home" href="https://anthony-apps.netlify.app/" title="回入口" aria-label="回入口"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
    <button class="ib" id="bOpen" title="換照片"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></button>
    <span class="sp"></span>
    <button class="tb" id="bResetAll" title="效果全部重設（可以按復原找回來）" disabled>全部重設</button>
    <button class="tb" id="bMerge" title="合併濾鏡：把目前的濾鏡畫進照片，再疊下一個" disabled>合併</button>
    <button class="ib desk" id="bKeys" title="快捷鍵（?）"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
    <button class="save" id="bSave" disabled>儲存</button>
  </header>

  <main id="stage">
    <div id="fbox"><canvas id="frame" hidden></canvas>
    <div id="wrap">
      <canvas id="gl"></canvas>
      <canvas id="pop"></canvas>
      <div class="badge">原圖</div>
      <div id="stickers"></div>
      <div id="texts"></div>
      <div id="crop"><div class="shade s1"></div><div class="shade s2"></div><div class="shade s3"></div><div class="shade s4"></div>
        <div class="box"><span class="h tl" data-h="tl"></span><span class="h tr" data-h="tr"></span><span class="h bl" data-h="bl"></span><span class="h br" data-h="br"></span></div></div>
    </div>
    </div>
    <div id="hist"><span class="hg"><button class="fb" id="bUndo" title="復原（⌘Z）" aria-label="復原" disabled><svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4 7a9 9 0 1 1-1 7"/></svg></button><button class="fb" id="bRedo" title="重做（⇧⌘Z）" aria-label="重做" disabled><svg viewBox="0 0 24 24"><path d="M15 7h5V2"/><path d="M20 7a9 9 0 1 0 1 7"/></svg></button></span><span class="hg"><button class="fb" id="bCmp" title="按住看原圖（空白鍵）" aria-label="按住看原圖" disabled><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 4v16"/></svg></button></span></div>
    <div id="zoom"><button id="zOut" title="縮小（⌘−）">−</button><button id="zPct" title="回到全覽（⌘0）">100%</button><button id="zIn" title="放大（⌘＋）">+</button></div>
    <div id="empty">
      <h1>隨手修</h1>
      <p>修圖、濾鏡、美顏、去背、消除，全部免費。<br>照片只在你的裝置上處理，不會上傳。</p>
      <button class="big" id="bPick">選一張照片</button>
      <button class="big alt" id="bCam">拍照</button>
      <div class="two"><button class="big alt" id="bCollage">拼貼</button><button class="big alt" id="bTpl">範本</button></div>
      <small>電腦上也可以直接把照片拖進來或貼上。</small>
    </div>
  </main>

  <section id="panel" class="off">
    <div id="pbody">
    <div class="srow hide" id="srow"><label id="sLabel"></label><input type="range" id="slider" min="-100" max="100" value="0" aria-label="強度"><output id="sVal">0</output></div>
    <div id="rows"></div>
    <div class="phead"><div class="note" id="note"></div><button id="bTabReset" hidden>重設</button></div>
    <div class="textedit" id="textedit" hidden><textarea id="textInput" rows="1" placeholder="輸入文字"></textarea></div>
    <div class="textedit" id="stsearch" hidden><input id="stkQ" type="search" placeholder="搜尋貼紙，例如愛心、星星" enterkeyhint="search"></div>
    <div class="items" id="cats" hidden></div>
    <div class="items" id="items"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="beauty">美顏</button>
      <button class="tab" data-tab="shape">臉型</button>
      <button class="tab" data-tab="reshape">推臉</button>
      <button class="tab" data-tab="bbrush">美顏筆</button>
      <button class="tab" data-tab="makeup">美妝</button>
      <button class="tab" data-tab="skin">膚質</button>
      <button class="tab" data-tab="sculpt">塑臉</button>
      <button class="tab" data-tab="aiskin">AI美肌</button>
      <button class="tab" data-tab="light">光影</button>
      <button class="tab" data-tab="hair">頭髮</button>
      <button class="tab" data-tab="body">身體</button>
      <button class="tab" data-tab="cover">遮臉</button>
      <button class="tab" data-tab="looks">一鍵出片</button>
      <button class="tab" data-tab="filter">濾鏡</button>
      <button class="tab" data-tab="adjust">調整</button>
      <button class="tab" data-tab="grade">調色</button>
      <button class="tab" data-tab="erase">消除</button>
      <button class="tab" data-tab="doodle">塗鴉</button>
      <button class="tab" data-tab="cutout">去背</button>
      <button class="tab" data-tab="fun">創意</button>
      <button class="tab" data-tab="cut">摳圖</button>
      <button class="tab" data-tab="text">文字</button>
      <button class="tab" data-tab="sticker">貼紙</button>
      <button class="tab" data-tab="crop">裁切</button>
      <button class="tab" data-tab="frame">邊框</button>
      <button class="tab" data-tab="tpl">範本</button>
    </nav>
    <nav id="groups"></nav>
  </section>
</div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="color" id="colorPick" hidden>
<input type="file" id="file2" accept="image/*" hidden>
<input type="file" id="fileMulti" accept="image/*" multiple hidden>
<input type="file" id="file3" accept="image/*" hidden>
<input type="file" id="file4" accept="image/*" hidden>
<input type="file" id="file5" accept="image/*" hidden>
<div id="toast"></div>
<div id="bubble"></div>
<div id="keys"><div class="box"><h2>快捷鍵</h2><dl id="keysList"></dl></div></div>
<div id="busy"><div id="busyText">處理中…</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
