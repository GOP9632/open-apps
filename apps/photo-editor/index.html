<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>隨手修</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0e0e10;--panel:#17171a;--panel2:#222227;--line:#2c2c32;--text:#f4f4f5;--muted:#9a9aa3;
  --accent:#ff5c8a;--accent2:#ffb36b;--grad:linear-gradient(135deg,#ff8a6b,#ff5c8a);
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
select,input,textarea{font-size:16px}
button{background:none;border:0;padding:0;cursor:pointer}
#app{display:flex;flex-direction:column;height:100dvh;height:100vh;height:100dvh}

/* 上方工具列 */
.top{display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 8px) 12px 8px}
.top .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.ib:disabled{opacity:.3}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.save{height:36px;padding:0 18px;border-radius:18px;background:var(--grad);color:#fff;font-weight:600}
.save:disabled{opacity:.35}

/* 畫面 */
#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#fbox{position:relative;flex:none}
#frame{position:absolute;inset:0;width:100%;height:100%;display:block}
#frame[hidden]{display:none}
#wrap{position:absolute;left:0;top:0;display:none}
#wrap.on{display:block}
#gl{display:block;width:100%;height:100%;background:repeating-conic-gradient(#2a2a2e 0 25%,#1f1f23 0 50%) 0 0/20px 20px}
#orig{position:absolute;inset:0;width:100%;height:100%;display:none}
#wrap.cmp #orig{display:block}
.badge{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:4px 10px;border-radius:10px;font-size:13px;display:none}
#wrap.cmp .badge{display:block}

#empty{text-align:center;padding:24px;max-width:340px}
#empty h1{font-size:28px;margin:0 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#empty p{color:var(--muted);margin:0 0 24px;line-height:1.6}
.big{display:block;width:100%;height:52px;border-radius:26px;background:var(--grad);color:#fff;font-weight:600;font-size:17px;margin-bottom:12px}
.big.alt{background:var(--panel2);color:var(--text)}
#empty small{display:block;color:var(--muted);margin-top:14px;line-height:1.6}

/* 文字貼圖 */
#texts{position:absolute;inset:0;pointer-events:none}
.tx{position:absolute;transform:translate(-50%,-50%);white-space:pre;line-height:1.2;font-weight:700;pointer-events:auto;cursor:move;touch-action:none;padding:2px 6px;border:1.5px dashed transparent;border-radius:6px}
.tx.sel{border-color:rgba(255,255,255,.8)}

/* 貼紙 */
#stickers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.st{position:absolute;pointer-events:auto;touch-action:none;cursor:move;display:grid;place-items:center;outline:1.5px dashed transparent;outline-offset:2px;border-radius:4px}
.st svg{width:100%;height:100%;display:block}
.st.sel{outline-color:rgba(255,255,255,.85)}
#wrap.lightdrag{cursor:grab}
.it.stk .ic svg{width:38px;height:30px;stroke:none;fill:initial;stroke-width:initial}
.it.stk .ic svg *{stroke-linecap:initial}
.it.emo{width:52px}
.it.emo2 .ic{font-size:24px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.it.emo .ic{font-size:26px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* 裁切框 */
#crop{position:absolute;inset:0;display:none;touch-action:none}
#crop.on{display:block}
#crop .shade{position:absolute;background:rgba(0,0,0,.55)}
#crop .box{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
#crop .box::before,#crop .box::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.4) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.4) 0 calc(66.66% + .5px),transparent 0)}
#crop .box::after{background:linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.4) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.4) 0 calc(66.66% + .5px),transparent 0)}
#crop .h{position:absolute;width:28px;height:28px;border:3px solid #fff;margin:-4px}
#crop .h.tl{left:0;top:0;border-right:0;border-bottom:0}
#crop .h.tr{right:0;top:0;border-left:0;border-bottom:0}
#crop .h.bl{left:0;bottom:0;border-right:0;border-top:0}
#crop .h.br{right:0;bottom:0;border-left:0;border-top:0}

/* 下方面板 */
#panel{background:var(--panel);border-radius:18px 18px 0 0;padding:10px 0 calc(var(--safe-b) + 4px)}
#panel.off{display:none}
.srow{display:flex;align-items:center;gap:12px;padding:4px 18px 10px;min-height:44px}
.srow.hide{visibility:hidden}
.srow label{width:44px;color:var(--muted);font-size:13px;flex:none}
.srow output{width:40px;text-align:right;font-variant-numeric:tabular-nums;flex:none;font-size:14px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--fill-a,0%),#fff var(--fill-a,0%),#fff var(--fill-b,0%),#4a4a52 var(--fill-b,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9.5px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:3px;background:#4a4a52;border-radius:2px}
input[type=range]::-moz-range-progress{height:3px;background:#fff}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}

.items{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 10px;scrollbar-width:none}
.items::-webkit-scrollbar{display:none}
.items[hidden]{display:none}
#cats{padding-bottom:6px}
#cats .it.wide .ic{height:34px;font-size:13px}
.it{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.it .ic{width:46px;height:46px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;position:relative;color:var(--text);font-size:13px}
.it .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.it.on{color:var(--text)}
.it.on .ic{box-shadow:0 0 0 2px var(--accent)}
.it .dot{position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.it.set .dot{display:block}
.it.ft{width:68px}
.it.ft .ic{width:62px;height:62px;border-radius:12px;overflow:hidden;background-size:cover;background-position:center}
.it.wide{width:auto;padding:0 2px}
.it.wide .ic{width:auto;padding:0 16px;border-radius:23px;white-space:nowrap}
.sw{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.25)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}

.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding-top:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:44px;height:40px;padding:0 4px;color:var(--muted);font-size:14px}
.tab.on{color:var(--text);font-weight:600}

.note{color:var(--muted);font-size:13px;padding:0 18px 8px;min-height:18px}
.textedit{display:flex;gap:8px;padding:0 12px 10px}
.textedit[hidden]{display:none}
.textedit textarea{flex:1;min-height:44px;max-height:96px;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:10px 12px;color:var(--text)}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 190px);transform:translateX(-50%);background:rgba(30,30,34,.95);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:86vw;text-align:center}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:8}
#busy.on{display:grid}
#busy div{background:var(--panel);padding:16px 20px;border-radius:14px}

@media (min-width:900px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .top{grid-column:1/-1}
  #stage{grid-column:1;grid-row:2}
  #panel{grid-column:2;grid-row:2;width:380px;min-height:0;overflow-y:auto;border-radius:18px 0 0 0;display:flex;flex-direction:column}
  #panel .items{flex-wrap:wrap;overflow:visible}
  #panel .tabs{order:-1;border-top:0;border-bottom:1px solid var(--line);margin-bottom:10px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ib" id="bOpen" title="換照片"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></button>
    <span class="sp"></span>
    <button class="ib" id="bUndo" title="復原" disabled><svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4 7a9 9 0 1 1-1 7"/></svg></button>
    <button class="ib" id="bRedo" title="重做" disabled><svg viewBox="0 0 24 24"><path d="M15 7h5V2"/><path d="M20 7a9 9 0 1 0 1 7"/></svg></button>
    <button class="ib" id="bCmp" title="按住看原圖" disabled><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 4v16"/><path d="M12 4l9 16" opacity=".0"/></svg></button>
    <span class="sp"></span>
    <button class="save" id="bSave" disabled>儲存</button>
  </header>

  <main id="stage">
    <div id="fbox"><canvas id="frame" hidden></canvas>
    <div id="wrap">
      <canvas id="gl"></canvas>
      <canvas id="orig"></canvas>
      <div class="badge">原圖</div>
      <div id="stickers"></div>
      <div id="texts"></div>
      <div id="crop"><div class="shade s1"></div><div class="shade s2"></div><div class="shade s3"></div><div class="shade s4"></div>
        <div class="box"><span class="h tl" data-h="tl"></span><span class="h tr" data-h="tr"></span><span class="h bl" data-h="bl"></span><span class="h br" data-h="br"></span></div></div>
    </div>
    </div>
    <div id="empty">
      <h1>隨手修</h1>
      <p>修圖、濾鏡、美顏、去背、消除，全部免費。<br>照片只在你的裝置上處理，不會上傳。</p>
      <button class="big" id="bPick">選一張照片</button>
      <button class="big alt" id="bCam">拍照</button>
      <small>電腦上也可以直接把照片拖進來或貼上。</small>
    </div>
  </main>

  <section id="panel" class="off">
    <div class="srow hide" id="srow"><label id="sLabel"></label><input type="range" id="slider" min="-100" max="100" value="0" aria-label="強度"><output id="sVal">0</output></div>
    <div class="note" id="note"></div>
    <div class="textedit" id="textedit" hidden><textarea id="textInput" rows="1" placeholder="輸入文字"></textarea></div>
    <div class="items" id="cats" hidden></div>
    <div class="items" id="items"></div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="adjust">調整</button>
      <button class="tab" data-tab="grade">調色</button>
      <button class="tab" data-tab="filter">濾鏡</button>
      <button class="tab" data-tab="beauty">美顏</button>
      <button class="tab" data-tab="shape">臉型</button>
      <button class="tab" data-tab="makeup">美妝</button>
      <button class="tab" data-tab="body">身體</button>
      <button class="tab" data-tab="hair">頭髮</button>
      <button class="tab" data-tab="light">光影</button>
      <button class="tab" data-tab="sticker">貼紙</button>
      <button class="tab" data-tab="fun">創意</button>
      <button class="tab" data-tab="frame">邊框</button>
      <button class="tab" data-tab="text">文字</button>
      <button class="tab" data-tab="erase">消除</button>
      <button class="tab" data-tab="cutout">去背</button>
      <button class="tab" data-tab="crop">裁切</button>
    </nav>
  </section>
</div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="color" id="colorPick" hidden>
<input type="file" id="file2" accept="image/*" hidden>
<input type="file" id="file3" accept="image/*" hidden>
<div id="toast"></div>
<div id="busy"><div id="busyText">處理中…</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
